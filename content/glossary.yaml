- term: Inflation
  def: The general rise in prices over time, so each rupee buys less. India measures it with CPI.
  lesson: m1-inflation
- term: CPI (Consumer Price Index)
  def: India's official inflation measure, published monthly by MoSPI's National Statistics Office.
  lesson: m1-inflation
- term: Real return
  def: Return after inflation. Roughly return % minus inflation %.
  lesson: m1-inflation
- term: Nominal return
  def: The return as quoted, before adjusting for inflation.
  lesson: m1-inflation
- term: Compounding
  def: Earning returns on past returns, not just on the original amount.
  lesson: m1-compounding
- term: Effective annual rate
  def: The true yearly rate after compounding within the year.
  lesson: m1-compounding
- term: Rule of 72
  def: 72 ÷ rate ≈ years for money (or prices) to double.
  lesson: m1-compounding
- term: Net worth
  def: Everything you own minus everything you owe.
  lesson: m1-networth-budget
- term: Cash flow
  def: Money coming in minus money going out over a period, usually a month.
  lesson: m1-networth-budget
- term: Emergency fund
  def: Several months of essential expenses kept safe and quickly accessible for job loss, medical bills or urgent needs.
  lesson: m1-networth-budget
- term: CTC (Cost to Company)
  def: The employer's total yearly cost for you, including items you never receive monthly.
  lesson: m2-ctc
- term: Gross salary
  def: Monthly earnings before deductions.
  lesson: m2-ctc
- term: In-hand / net salary
  def: What reaches your bank after PF, professional tax, TDS and other deductions.
  lesson: m2-ctc
- term: Professional tax
  def: A small state tax on employment deducted from salary, in states that levy it (Telangana does).
  lesson: m2-ctc
- term: Labour Codes
  def: Four laws (wages, social security, industrial relations, workplace safety) that replaced 29 labour laws from 21 Nov 2025.
  lesson: m2-ctc
- term: EPF
  def: Employees' Provident Fund. You and your employer contribute monthly; EPFO declares interest yearly.
  lesson: m2-epf-gratuity
- term: EPS
  def: Employees' Pension Scheme. Part of the employer's PF contribution goes here to fund a pension.
  lesson: m2-epf-gratuity
- term: VPF
  def: Voluntary Provident Fund. Extra contribution you choose to make to EPF through your employer.
  lesson: m2-epf-gratuity
- term: UAN
  def: Universal Account Number. One PF number for your whole career.
  lesson: m2-epf-gratuity
- term: Gratuity
  def: A lump sum from your employer when you leave after qualifying service, about 15 days' wages per year of service.
  lesson: m2-epf-gratuity
- term: TDS
  def: Tax Deducted at Source. Tax cut before you're paid (salary, FD interest, etc.) and deposited against your PAN.
  lesson: m2-tax-docs
- term: Form 16 / Form 130
  def: Your employer's annual certificate of salary and TDS. Form 16 up to FY 2025-26; Form 130 from tax year 2026-27.
  lesson: m2-tax-docs
- term: Form 26AS / Form 168
  def: Annual tax statement showing tax deducted/collected against your PAN. Form 168 from tax year 2026-27.
  lesson: m2-tax-docs
- term: AIS
  def: Annual Information Statement. Everything the tax department knows about your income and big transactions.
  lesson: m2-tax-docs
- term: Tax year
  def: Under the Income-tax Act, 2025, the April–March year (e.g. 2026-27), replacing "previous year" and "assessment year".
  lesson: m2-tax-docs
- term: HRA
  def: House Rent Allowance. Can be partly tax-free under the old regime if you pay rent.
  lesson: m2-tax-docs
- term: Old vs new tax regime
  def: Two ways to compute income tax. New has lower rates and few deductions; old has higher rates with deductions.
  lesson: m2-tax-docs
- term: DICGC
  def: RBI subsidiary that insures bank deposits up to a limit per depositor per bank.
  lesson: m3-accounts-upi
- term: UPI PIN
  def: The secret number that authorises payments OUT of your account. Never needed to receive money.
  lesson: m3-accounts-upi
- term: Collect request
  def: A UPI request from someone asking you to pay. Approving it sends your money.
  lesson: m3-accounts-upi
- term: Sweep-in FD
  def: Auto-moves extra savings into an FD and back when needed.
  lesson: m3-accounts-upi
- term: Minimum due
  def: The smallest amount you can pay on a credit card to avoid a late fee. Interest still applies on the rest.
  lesson: m3-cards-credit
- term: MITC
  def: Most Important Terms and Conditions. The card/loan document listing rates and fees.
  lesson: m3-cards-credit
- term: Credit score
  def: A number from a credit bureau summarising how reliably you repay. Used by lenders.
  lesson: m3-cards-credit
- term: Credit utilisation
  def: Share of your credit limit you're using.
  lesson: m3-cards-credit
- term: Hard enquiry
  def: When a lender checks your credit report because you applied for credit. Many in a short time can lower your score.
  lesson: m3-cards-credit
- term: No-cost EMI
  def: An EMI offer where interest is supposedly waived, often offset by fees, GST or a removed discount.
  lesson: m3-cards-credit
- term: Phishing / vishing
  def: Fraud by fake messages/links (phishing) or phone calls (vishing) to steal OTPs, passwords or money.
  lesson: m3-fraud
- term: Digital arrest
  def: A scam where fraudsters pose as police on video calls and demand money. Not a real legal process.
  lesson: m3-fraud
- term: SIM swap
  def: Fraudster gets a duplicate of your SIM to receive your OTPs.
  lesson: m3-fraud
- term: EMI
  def: Equated Monthly Instalment. Fixed monthly loan payment covering interest and part of the principal.
  aliases: [EMIs]
  lesson: m4-emi
- term: APR
  def: Annual Percentage Rate. The yearly cost of a loan including fees, useful for comparing offers.
  lesson: m4-true-cost
- term: SIP
  def: Systematic Investment Plan. Investing a fixed amount in a mutual fund every month.
  aliases: [SIPs]
  lesson: m7-sip-behaviour
- term: Step-up SIP
  def: A SIP whose monthly amount rises by a fixed % or amount each year.
  aliases: [step-up]
  lesson: m7-sip-behaviour
- term: Expense ratio
  def: Yearly fee a mutual fund charges, as a % of your investment, deducted daily from the NAV. Lower is better, all else equal.
  aliases: [TER, total expense ratio, expense ratios]
  lesson: m7-costs-index

# ---- Module 0: money from zero ----
- term: Interest
  def: The price of using someone else's money. You earn it on deposits; you pay it on loans and unpaid card bills.
  lesson: m0-banks
- term: Per annum (p.a.)
  def: Per year. Interest rates in India are almost always quoted per annum.
  aliases: [p.a]
  lesson: m0-banks
- term: RBI (Reserve Bank of India)
  def: India's central bank. Regulates banks, NBFCs and payments, sets the repo rate and issues currency notes.
  aliases: [Reserve Bank]
  lesson: m0-banks
- term: Repo rate
  def: The rate at which banks borrow short-term money from RBI. When it changes, loan and deposit rates usually follow.
  more: |
    RBI's Monetary Policy Committee reviews it roughly every two months. Many home and personal loans are linked to it (or to an external benchmark that follows it), so a repo cut usually lowers your EMI or tenure after the next reset. Module 6 explains why RBI moves it.
  lesson: m6-rbi-rates
- term: CRR (Cash Reserve Ratio)
  def: The share of deposits a bank must keep with RBI as cash, earning nothing. A safety buffer and a policy tool.
  lesson: m0-banks
- term: SLR (Statutory Liquidity Ratio)
  def: The share of deposits a bank must hold in very safe, liquid assets, mainly government bonds.
  lesson: m0-banks
- term: Payments bank
  def: A bank that can take limited deposits and make payments but cannot give loans or issue credit cards (e.g. Airtel, India Post Payments Bank).
  lesson: m0-banks
- term: Small finance bank
  def: A licensed bank focused on smaller borrowers. Deposits are covered by DICGC like any bank; often offers higher FD rates.
  lesson: m0-banks
- term: Lakh
  def: 1,00,000 (one hundred thousand). 10 lakh = 1 million.
  lesson: m0-banks
- term: Crore
  def: 1,00,00,000 = 100 lakh = 10 million.
  lesson: m0-banks
- term: Savings account
  def: Your everyday bank account. Withdraw any time, earns low interest, linked to UPI and debit card.
  aliases: [savings bank account, SB account]
  lesson: m0-account-types
- term: Salary account
  def: A savings account your employer opens for salary credits. Usually zero-balance only while salary keeps coming.
  lesson: m0-account-types
- term: Current account
  def: A bank account for businesses with many transactions. Pays no interest.
  lesson: m0-account-types
- term: FD (Fixed Deposit)
  def: A lump sum locked with a bank for a fixed period at a fixed rate. Higher interest than savings; penalty if broken early.
  aliases: [term deposit]
  lesson: m0-account-types
- term: RD (Recurring Deposit)
  def: A fixed amount deposited every month for a fixed period, at an FD-like rate.
  lesson: m0-account-types
- term: Cumulative FD
  def: An FD where interest is added back and paid with the principal at maturity, instead of being paid out regularly.
  lesson: m0-account-types
- term: Maturity
  def: The date a deposit, bond or policy ends and pays out.
  lesson: m0-account-types
- term: BSBDA
  def: Basic Savings Bank Deposit Account. A zero-balance account every bank must offer, with limits on withdrawals.
  lesson: m0-account-types
- term: Minimum average balance (MAB)
  def: The average balance some accounts require over a month or quarter. Fall short and the bank charges a fee (plus GST).
  lesson: m0-account-types
- term: KYC (Know Your Customer)
  def: The identity and address check banks and investment firms must do before opening an account. Do it only through official channels.
  aliases: [re-KYC]
  lesson: m0-account-types
- term: Nominee
  def: The person who can claim your money (account, FD, policy, investments) if something happens to you.
  lesson: m0-account-types
- term: Debit card
  def: A card that spends your own money from your bank account, immediately.
  lesson: m0-cards-payments
- term: Credit card
  def: A card that lets you borrow from the bank and repay later. Free if you pay the full bill on time; very costly if you don't.
  lesson: m0-cards-payments
- term: Credit limit
  def: The maximum the bank will lend you on a credit card. Borrowed money, not yours.
  lesson: m0-cards-payments
- term: Interest-free period
  def: The days between a card purchase and the bill's due date. Free only if you pay the total amount due.
  aliases: [grace period]
  lesson: m0-cards-payments
- term: UPI
  def: Unified Payments Interface. Moves money instantly between bank accounts using your phone, a UPI ID or a QR code.
  lesson: m0-cards-payments
- term: UPI ID
  def: Your payment address (like name@bank). Safe to share for receiving money.
  aliases: [VPA]
  lesson: m0-cards-payments
- term: NPCI
  def: National Payments Corporation of India. Runs UPI, RuPay, IMPS, NACH and FASTag.
  lesson: m0-cards-payments
- term: IMPS
  def: Immediate Payment Service. Instant bank-to-bank transfer, 24×7, using account number and IFSC.
  lesson: m0-cards-payments
- term: NEFT
  def: National Electronic Funds Transfer. Bank-to-bank transfers settled in frequent batches, 24×7.
  lesson: m0-cards-payments
- term: RTGS
  def: Real Time Gross Settlement. Real-time transfers for large amounts (there's a minimum).
  lesson: m0-cards-payments
- term: IFSC
  def: An 11-character code that identifies a bank branch, needed for NEFT, RTGS and IMPS.
  lesson: m0-cards-payments
- term: OTP
  def: One-Time Password. A short code that approves a transaction or login. Never share it with anyone.
  lesson: m0-cards-payments
- term: CVV
  def: The 3-digit security code on the back of a card. Never share it.
  lesson: m0-cards-payments
- term: UTR
  def: Unique Transaction Reference. The ID of a bank transfer or UPI payment; quote it in any complaint.
  aliases: [RRN]
  lesson: m0-cards-payments
- term: MDR (Merchant Discount Rate)
  def: The fee a shop pays on card payments, shared between banks and the card network.
  lesson: m0-cards-payments
- term: Card network
  def: The system that connects card payments between banks, e.g. RuPay, Visa, Mastercard.
  aliases: [RuPay, Visa, Mastercard]
  lesson: m0-cards-payments
- term: Asset
  def: Something you own that has money value, like savings, FDs, gold, a flat or mutual funds.
  lesson: m0-money-words
- term: Liability
  def: Money you owe, like loans, credit card dues or money borrowed from friends.
  lesson: m0-money-words
- term: Principal
  def: The original amount borrowed or invested, before interest.
  lesson: m0-money-words
- term: Tenure
  def: How long a loan or deposit runs, e.g. 48 months.
  lesson: m0-money-words
- term: Outstanding
  def: The part of a loan's principal you still have to repay.
  aliases: [outstanding principal]
  lesson: m0-money-words
- term: Secured loan
  def: A loan backed by collateral (house, car, gold, FD) the lender can take if you don't pay. Cheaper than unsecured.
  lesson: m0-money-words
- term: Unsecured loan
  def: A loan with no collateral, like a personal loan or credit card. Costlier, because the lender takes more risk.
  lesson: m0-money-words
- term: Collateral
  def: An asset pledged to a lender as security for a loan.
  lesson: m0-money-words
- term: Default
  def: Failing to repay a loan or card as agreed. It's reported to credit bureaus and hurts your credit score for years.
  lesson: m0-money-words
- term: Guarantor
  def: Someone who promises to repay if the borrower doesn't. Legally on the hook; it shows in their credit report too.
  lesson: m0-money-words
- term: Investment return
  def: What an investment earns, usually as % per year. Includes interest, dividends and change in price.
  aliases: [returns, return on investment]
  lesson: m0-money-words
- term: Risk
  def: How uncertain an investment's return is, including the chance of losing money.
  lesson: m0-money-words
- term: Volatility
  def: How much an investment's value swings up and down over time.
  lesson: m0-money-words
- term: Liquidity
  def: How quickly something can be turned into cash at a fair value. Savings = very liquid; a flat = not.
  aliases: [liquid]
  lesson: m0-money-words
- term: Diversification
  def: Spreading money across different investments so one bad outcome doesn't sink everything.
  aliases: [diversify, diversified]
  lesson: m0-money-words
- term: Shares / stocks
  def: Small pieces of ownership in a company. Their price rises and falls with the company's prospects.
  aliases: [stock, equity shares]
  lesson: m0-money-words
- term: Bond
  def: A loan you give to a government or company in return for regular interest and your money back at maturity.
  lesson: m0-money-words
- term: Mutual fund
  def: Money from many investors pooled and invested by a professional fund house in shares, bonds or both.
  aliases: [MF]
  lesson: m0-money-words
- term: Premium
  def: What you pay an insurer, monthly or yearly, to keep a policy active.
  lesson: m0-money-words
- term: Sum assured
  def: The maximum amount an insurer pays on a valid claim. Also called cover or sum insured.
  aliases: [sum insured]
  lesson: m0-money-words
- term: PAN
  def: Permanent Account Number, your tax ID. Needed for bank accounts, investments and salary. Never post it publicly.
  lesson: m0-money-words
- term: ITR (Income Tax Return)
  def: The yearly form where you report income to the Income Tax Department and settle any tax due or refund.
  lesson: m0-money-words
- term: Narration
  def: The description of a transaction on a bank statement, in bank shorthand (UPI, NEFT, ATW, POS, ACH…).
  aliases: [particulars]
  lesson: m0-bank-statement
- term: ACH / NACH
  def: Automatic debits from your account under a mandate you signed, e.g. EMIs, SIPs, insurance premiums.
  aliases: [ECS]
  lesson: m0-bank-statement
- term: Mandate
  def: Your standing permission for someone to debit your account automatically. You can view and cancel mandates in your bank or UPI app.
  aliases: [autopay, auto-debit, e-mandate]
  lesson: m0-bank-statement
- term: POS
  def: Point of Sale. A card payment on a shop's card machine.
  lesson: m0-bank-statement
- term: Value date
  def: The date from which a credit or debit counts for interest, which can differ from the transaction date.
  lesson: m0-bank-statement

# ---- Module 4: loans ----
- term: Amortisation schedule
  def: The month-by-month table of a loan showing how each EMI splits into interest and principal, and the balance left.
  aliases: [amortization schedule, amortisation]
  lesson: m4-emi
- term: Flat rate
  def: Interest charged on the original loan amount for the whole tenure, even as you repay. 10% flat ≈ 18% reducing.
  lesson: m4-emi
- term: Reducing balance rate
  def: Interest charged only on what you still owe. The normal, honest way loan rates are quoted.
  aliases: [reducing-balance rate, reducing rate]
  lesson: m4-emi
- term: Fixed rate
  def: An interest rate that stays the same for the agreed period.
  aliases: [fixed-rate, fixed interest rate]
  lesson: m4-rates
- term: Floating rate
  def: An interest rate that moves with a benchmark, such as RBI's repo rate.
  aliases: [floating-rate, floating interest rate]
  lesson: m4-rates
- term: External benchmark
  def: The outside reference rate (usually RBI's repo rate) that banks' floating retail loans must be linked to.
  aliases: [EBLR, benchmark]
  lesson: m4-rates
- term: Spread
  def: The margin a lender adds on top of the benchmark. Loan rate = benchmark + spread.
  lesson: m4-rates
- term: Rate reset
  def: When a floating-rate loan's rate is recalculated to reflect the benchmark. The lender must tell you your options.
  aliases: [reset]
  lesson: m4-rates
- term: Balance transfer
  def: Moving your outstanding loan to another lender at a lower rate. Worth it only if the savings beat the fees.
  lesson: m4-rates
- term: KFS (Key Facts Statement)
  def: A standard summary every retail loan must come with, showing rate, all fees, APR, total cost and repayment schedule.
  aliases: [Key Facts Statement, Key Fact Statement]
  lesson: m4-true-cost
- term: Processing fee
  def: A one-time fee lenders charge to set up a loan, plus GST. It raises the loan's real cost (APR).
  lesson: m4-true-cost
- term: Penal charges
  def: A reasonable, disclosed fee for late payment. Since 2024 lenders can't add penal interest to your rate or charge interest on it.
  aliases: [penal charge]
  lesson: m4-true-cost
- term: Prepayment
  def: Paying off part or all of a loan before schedule. Floating-rate loans to individuals carry no prepayment charges.
  aliases: [part-prepayment, foreclosure, prepay]
  lesson: m4-getting-out
- term: Overdraft
  def: A credit line on your account (often against an FD) that you draw only when needed, paying interest only on what you use.
  aliases: [loan against FD]
  lesson: m4-loan-types
- term: Gold loan
  def: A loan secured by your gold jewellery. Cheaper than personal loans; the gold can be auctioned if you don't repay.
  lesson: m4-loan-types
- term: BNPL (Buy Now Pay Later)
  def: Short-term credit at checkout. A loan on your credit report, with steep late fees.
  aliases: [Buy Now Pay Later, pay later]
  lesson: m4-loan-types
- term: LTV (Loan-to-value)
  def: The loan as a % of the asset's value. RBI caps it for home and gold loans, so you need a down payment or margin.
  aliases: [loan-to-value ratio]
  lesson: m4-loan-types
- term: Loan moratorium
  def: A period when loan repayments are paused (e.g. during an education course). Interest usually keeps building.
  aliases: [moratorium]
  lesson: m4-loan-types
- term: Co-borrower
  def: Someone jointly responsible for a loan from day one. It appears on their credit report too.
  aliases: [co-applicant]
  lesson: m4-getting-out
- term: Debt avalanche
  def: Paying off debts highest-interest-rate first. Saves the most money.
  aliases: [avalanche]
  lesson: m4-getting-out
- term: Debt snowball
  def: Paying off the smallest debt first for quick wins. Costs a bit more than avalanche but keeps some people motivated.
  aliases: [snowball]
  lesson: m4-getting-out
- term: One-time settlement
  def: Paying a lender less than you owe to end the loan. Shows as "settled" on your credit report and hurts future borrowing.
  aliases: [settlement, settled]
  lesson: m4-getting-out
- term: NOC (No Objection Certificate)
  def: The lender's letter confirming a loan is fully repaid and it has no further claim.
  aliases: [No Objection Certificate, closure letter]
  lesson: m4-getting-out
- term: Hypothecation
  def: A lender's claim on a movable asset (like your car) while you still use it. Remove it from the RC after closing the loan.
  lesson: m4-getting-out
- term: Credit report
  def: Your borrowing history from a credit bureau (CIBIL, Experian, Equifax, CRIF). Free once a year from each bureau.
  aliases: [credit history, CIR]
  lesson: m3-cards-credit
- term: Recovery agent
  def: Someone a lender hires to collect overdue loans. Must follow RBI's conduct rules, with no threats and no calls before 8 am or after 7 pm.
  aliases: [recovery agents]
  lesson: m4-getting-out

# ---- Module 5: insurance ----
- term: Term insurance
  def: Pure life cover for a fixed term. Pays the nominee if you die during the term; nothing if you survive. Cheapest way to get large cover.
  aliases: [term plan, term cover, term life insurance]
  lesson: m5-term
- term: Health insurance
  def: Pays hospital and treatment costs up to the sum insured, subject to the policy's limits and waiting periods.
  aliases: [mediclaim, health policy]
  lesson: m5-health
- term: Group insurance
  def: A policy covering a group, like your employer's health cover. Ends when you leave the group and still carries GST.
  aliases: [group cover, group health cover, employer cover]
  lesson: m5-how-insurance
- term: Family floater
  def: One health policy whose sum insured is shared by all covered family members.
  lesson: m5-health
- term: Room-rent limit
  def: A cap on the hospital room charge per day. Exceed it and most other charges are cut in the same proportion.
  aliases: [room rent limit, room-rent cap]
  lesson: m5-health
- term: Co-pay
  def: A fixed share of every claim you must pay yourself, e.g. 20%.
  aliases: [copay, co-payment]
  lesson: m5-health
- term: Sub-limit
  def: A cap on what a policy pays for a specific treatment or item, below the overall sum insured.
  aliases: [sub-limits]
  lesson: m5-health
- term: Waiting period
  def: Time after buying a health policy before certain illnesses are covered.
  aliases: [waiting periods]
  lesson: m5-health
- term: PED (Pre-existing disease)
  def: A condition you had before buying health insurance. Covered after a waiting period, at most 3 years.
  aliases: [pre-existing condition, pre-existing conditions, pre-existing diseases]
  lesson: m5-health
- term: Moratorium period
  def: After 5 years of continuous health cover, the insurer can't reject claims for non-disclosure, except proven fraud.
  lesson: m5-health
- term: Cashless claim
  def: The insurer pays a network hospital directly. The insurer must decide on cashless requests within 1 hour.
  aliases: [cashless]
  lesson: m5-health
- term: Reimbursement claim
  def: You pay the hospital, then claim the money back from the insurer with bills and reports.
  aliases: [reimbursement]
  lesson: m5-health
- term: Network hospital
  def: A hospital tied up with your insurer, where cashless treatment works.
  aliases: [network hospitals]
  lesson: m5-health
- term: TPA (Third Party Administrator)
  def: A company that processes health claims for insurers; the insurance desk at hospitals often works with them.
  lesson: m5-claims
- term: Super top-up
  def: Extra health cover that pays once your total bills in a year cross a deductible. Cheap way to raise cover.
  aliases: [super top-ups]
  lesson: m5-health
- term: Deductible
  def: The amount of a claim you (or another policy) must cover before this policy pays.
  lesson: m5-health
- term: Portability
  def: Moving a health policy to another insurer at renewal, keeping credit for waiting periods already served.
  lesson: m5-health
- term: NCB (No-Claim Bonus)
  def: A reward for claim-free years, either a premium discount (motor) or extra cover (health). A claim usually reduces or resets it.
  aliases: [no-claim bonus, no claim bonus]
  lesson: m5-claims
- term: Free-look period
  def: 30 days after you receive a policy during which you can cancel and get the premium back, minus small deductions.
  aliases: [free look period]
  lesson: m5-mis-selling
- term: Endowment plan
  def: A life policy that pays a lump sum at maturity or on death. Usually small cover and low returns (often 4–6% a year).
  aliases: [endowment, endowment plans, endowment policy]
  lesson: m5-mis-selling
- term: Money-back plan
  def: An endowment-style policy that pays parts of the sum assured every few years. Similar drawbacks to endowment plans.
  aliases: [money-back, money back plan]
  lesson: m5-mis-selling
- term: ULIP (Unit Linked Insurance Plan)
  def: A mix of life insurance and market investment with a 5-year lock-in and several charges.
  aliases: [ULIPs]
  lesson: m5-mis-selling
- term: IRR (Internal Rate of Return)
  def: The single yearly rate that makes what you pay equal what you get back, accounting for timing. The honest way to compare plans.
  lesson: m5-mis-selling
- term: Surrender value
  def: What you get if you exit a life policy early. Often less than the premiums paid in early years.
  lesson: m5-mis-selling
- term: Paid-up value
  def: The reduced maturity benefit you keep if you stop paying premiums but don't surrender the policy.
  aliases: [paid-up]
  lesson: m5-mis-selling
- term: Benefit illustration
  def: The insurer's document showing what you pay and what you'd get each year. Use it to calculate the IRR.
  lesson: m5-mis-selling
- term: Claim settlement ratio
  def: The share of claims an insurer paid in a year. Useful, but check the amount settled and time taken too.
  lesson: m5-term
- term: Rider
  def: An optional add-on to a policy (critical illness, accidental death, premium waiver) for an extra premium.
  aliases: [riders]
  lesson: m5-term
- term: Return of premium
  def: A term-plan variant that refunds premiums if you survive. Costs much more; usually worse than plain term + investing.
  lesson: m5-term
- term: MWPA (Married Women's Property Act)
  def: Buying a term policy under this Act holds the money in trust for your wife/children, safe from creditors and other claims.
  lesson: m5-term
- term: Third-party insurance
  def: Motor cover for injury or damage you cause to others. Compulsory by law.
  aliases: [third-party cover, third party]
  lesson: m5-claims
- term: Own damage
  def: Motor cover for repairs to your own vehicle.
  aliases: [OD cover]
  lesson: m5-claims
- term: Comprehensive motor insurance
  def: Third-party plus own-damage cover in one policy.
  aliases: [comprehensive cover, comprehensive policy]
  lesson: m5-claims
- term: IDV (Insured Declared Value)
  def: Your vehicle's insured value, roughly its market value; the most paid if it's stolen or totalled.
  lesson: m5-claims
- term: Zero depreciation
  def: A motor add-on that pays the full cost of replaced parts without deducting depreciation.
  aliases: [zero-dep, zero dep]
  lesson: m5-claims
- term: Personal accident cover
  def: Pays a lump sum (and sometimes weekly income) if an accident causes death or disability.
  aliases: [personal accident, PA cover]
  lesson: m5-claims
- term: Insurance Ombudsman
  def: A free body that resolves complaints against insurers once the insurer has rejected yours or not replied within a month.
  aliases: [Ombudsman]
  lesson: m5-claims
- term: Bima Bharosa
  def: IRDAI's grievance management system for insurance complaints. Use only the official IRDAI site.
  lesson: m5-claims

# ---- Module 6: the economy ----
- term: Monetary policy
  def: RBI's management of interest rates and money supply to keep inflation near target while supporting growth.
  lesson: m6-rbi-rates
- term: MPC (Monetary Policy Committee)
  def: RBI's six-member committee that sets the repo rate, meeting about every two months.
  lesson: m6-rbi-rates
- term: Inflation targeting
  def: RBI's mandate to keep CPI inflation at 4%, within a 2–6% band. Renewed for 2026–2031.
  aliases: [inflation target]
  lesson: m6-rbi-rates
- term: Transmission
  def: How fully and quickly an RBI rate change reaches loan and deposit rates.
  lesson: m6-rbi-rates
- term: Real interest rate
  def: An interest rate minus inflation. What a saver actually gains, or a borrower actually pays, in buying power.
  aliases: [real rate, real policy rate]
  lesson: m6-rbi-rates
- term: GDP (Gross Domestic Product)
  def: The value of all final goods and services produced in a country in a period.
  lesson: m6-gdp-inflation
- term: Real GDP
  def: GDP after removing the effect of price increases. Headline "growth" usually means real GDP growth.
  aliases: [real growth, real GDP growth]
  lesson: m6-gdp-inflation
- term: Nominal GDP
  def: GDP measured at current prices, including inflation.
  aliases: [nominal growth]
  lesson: m6-gdp-inflation
- term: Per-capita income
  def: A country's income (or GDP) divided by its population. An average per person, not what a typical person earns.
  aliases: [per capita income, per-capita GDP]
  lesson: m6-gdp-inflation
- term: Headline inflation
  def: Inflation across the full CPI basket, including volatile food and fuel.
  lesson: m6-gdp-inflation
- term: Core inflation
  def: Inflation excluding food and fuel, showing the underlying trend.
  lesson: m6-gdp-inflation
- term: WPI (Wholesale Price Index)
  def: Measures price changes at the wholesale level. Not what households pay; RBI targets CPI instead.
  lesson: m6-gdp-inflation
- term: Recession
  def: A period when the economy shrinks. A common rule of thumb is two consecutive quarters of falling real GDP.
  aliases: [recessions]
  lesson: m6-gdp-inflation
- term: Stagflation
  def: Weak growth combined with high inflation. Hard for central banks, since fighting inflation hurts growth further.
  lesson: m6-gdp-inflation
- term: Union Budget
  def: The central government's yearly statement of planned income and spending, presented on 1 February.
  aliases: [Budget day]
  lesson: m6-budget
- term: Fiscal deficit
  def: Government spending minus its income excluding borrowing. Covered by borrowing, mostly through bonds.
  lesson: m6-budget
- term: Direct tax
  def: Tax paid directly on income or profits, like income tax and corporate tax.
  aliases: [direct taxes]
  lesson: m6-budget
- term: Indirect tax
  def: Tax built into prices of goods and services, like GST and customs duty.
  aliases: [indirect taxes]
  lesson: m6-budget
- term: GST (Goods and Services Tax)
  def: India's main indirect tax on goods and services, shared between the Centre and states.
  lesson: m6-budget
- term: Capex (capital expenditure)
  def: Spending on long-lasting assets like roads, railways and machinery, as opposed to running costs.
  aliases: [capital expenditure, capital spending]
  lesson: m6-budget
- term: G-sec (Government security)
  def: A bond issued by the government to borrow. The safest rupee investment; its yield is a benchmark for other rates.
  aliases: [G-secs, government bond, government bonds, government securities]
  lesson: m6-budget
- term: Treasury bill
  def: Short-term government borrowing (up to one year), sold at a discount and repaid at face value.
  aliases: [T-bill, T-bills, treasury bills]
  lesson: m6-budget
- term: Exchange rate
  def: The price of one currency in another, such as rupees per US dollar.
  lesson: m6-rupee-world
- term: Rupee depreciation
  def: The rupee weakening, so each dollar (or other currency) costs more rupees.
  aliases: [depreciates, rupee weakens]
  lesson: m6-rupee-world
- term: Forex reserves
  def: Foreign currency and gold held by RBI, used to smooth sharp rupee swings and as insurance in a crisis.
  aliases: [foreign exchange reserves]
  lesson: m6-rupee-world
- term: Current account deficit
  def: When a country pays out more for imports, services and income than it earns from them. India usually runs a small one.
  lesson: m6-rupee-world
- term: Remittances
  def: Money sent home by people working abroad. A big source of dollars for India.
  lesson: m6-rupee-world
- term: US Federal Reserve
  def: America's central bank. Its interest-rate moves affect global money flows, including into and out of India.
  aliases: [the Fed, Federal Reserve]
  lesson: m6-rupee-world
- term: Coupon
  def: The fixed interest a bond pays, as a % of its face value.
  lesson: m6-markets-cycles
- term: Bond yield
  def: The return from buying a bond at today's price and holding it to maturity. Yields up = prices down.
  aliases: [yield, yields]
  lesson: m6-markets-cycles
- term: Economic cycle
  def: The repeating pattern of expansion, slowdown, sometimes recession, and recovery.
  aliases: [business cycle, cycles]
  lesson: m6-markets-cycles

# ---- Module 7: mutual funds ----
- term: NAV (Net Asset Value)
  def: The value of one unit of a mutual fund = (holdings − liabilities) ÷ units. Calculated every business day.
  aliases: [NAVs]
  lesson: m7-what-is-mf
- term: Units
  def: Your share of a mutual fund. Value = units × NAV.
  lesson: m7-what-is-mf
- term: AMC (Asset Management Company)
  def: The fund house that manages mutual fund schemes for a fee.
  aliases: [fund house, AMCs]
  lesson: m7-what-is-mf
- term: AUM (Assets Under Management)
  def: The total money a fund or fund house manages.
  lesson: m7-what-is-mf
- term: RTA (Registrar and Transfer Agent)
  def: Keeps mutual fund unit records and sends statements, mainly CAMS and KFintech.
  aliases: [registrar, registrars, CAMS, KFintech]
  lesson: m7-what-is-mf
- term: Riskometer
  def: SEBI's label on every scheme, from Low to Very High, showing how much its value can swing.
  lesson: m7-what-is-mf
- term: NFO (New Fund Offer)
  def: The launch of a new mutual fund scheme, usually at ₹10 per unit. A low unit price doesn't mean cheap.
  aliases: [NFOs]
  lesson: m7-what-is-mf
- term: Equity fund
  def: A mutual fund that mainly owns shares. Higher long-term growth potential, with big swings.
  aliases: [equity funds, equity mutual fund]
  lesson: m7-fund-types
- term: Debt fund
  def: A mutual fund that owns bonds and money-market instruments. Risks are interest-rate changes and borrower defaults.
  aliases: [debt funds, debt mutual fund, debt mutual funds]
  lesson: m7-fund-types
- term: Hybrid fund
  def: A mutual fund holding both equity and debt within set ranges.
  aliases: [hybrid funds, balanced advantage]
  lesson: m7-fund-types
- term: Market capitalisation
  def: A company's total share value (share price × number of shares). Used to classify large-, mid- and small-cap.
  aliases: [market cap, market capitalization]
  lesson: m7-fund-types
- term: Large-cap
  def: The 100 biggest listed companies by market value; funds investing mainly in them.
  aliases: [large-cap fund, large-cap funds, large cap]
  lesson: m7-fund-types
- term: Mid-cap
  def: Companies ranked 101–250 by market value. More growth potential and more volatility than large-caps.
  aliases: [mid-cap fund, mid cap]
  lesson: m7-fund-types
- term: Small-cap
  def: Companies ranked 251st and below by market value. The most volatile equity category.
  aliases: [small-cap fund, small cap]
  lesson: m7-fund-types
- term: Flexi-cap fund
  def: An equity fund free to invest across large, mid and small companies in any proportion.
  aliases: [flexi-cap]
  lesson: m7-fund-types
- term: ELSS
  def: Equity Linked Savings Scheme. Equity fund with a 3-year lock-in; tax deduction available only under the old regime.
  lesson: m7-fund-types
- term: Sectoral fund
  def: A fund concentrated in one sector or theme (banking, tech, defence). Higher risk than diversified funds.
  aliases: [thematic fund, sectoral, thematic funds, sectoral funds]
  lesson: m7-fund-types
- term: Liquid fund
  def: A debt fund holding very short-term paper, used to park money for days to months.
  aliases: [liquid funds]
  lesson: m7-fund-types
- term: Overnight fund
  def: A debt fund lending for one day at a time. The lowest-risk mutual fund category.
  lesson: m7-fund-types
- term: Gilt fund
  def: A debt fund that invests in government bonds. No default risk, but long ones swing with interest rates.
  aliases: [gilt]
  lesson: m7-fund-types
- term: Credit risk
  def: The chance a borrower doesn't repay. In debt funds, lower-rated bonds pay more because of it.
  aliases: [credit risk fund, credit risk funds]
  lesson: m7-fund-types
- term: Duration
  def: A measure of how sensitive a bond or debt fund is to interest-rate changes. Higher duration = bigger price swings.
  aliases: [interest-rate risk, interest rate risk]
  lesson: m7-fund-types
- term: Arbitrage fund
  def: A hybrid fund using low-risk trades between cash and futures markets; behaves like debt, taxed like equity.
  lesson: m7-fund-types
- term: Index fund
  def: A mutual fund that copies an index (like the Nifty 50) at low cost, without a manager picking stocks.
  aliases: [index funds, passive fund]
  lesson: m7-costs-index
- term: ETF (Exchange Traded Fund)
  def: A fund, usually tracking an index, whose units trade on the stock exchange like shares. Needs a demat account.
  aliases: [ETFs]
  lesson: m7-costs-index
- term: Nifty 50
  def: An index of 50 large Indian companies on the NSE, weighted by size. A common benchmark and index-fund target.
  aliases: [Nifty]
  lesson: m7-costs-index
- term: Benchmark index
  def: The index a fund's performance is compared against, e.g. Nifty 100 for a large-cap fund.
  aliases: [benchmark indices]
  lesson: m7-costs-index
- term: Active fund
  def: A fund whose manager picks investments to try to beat its benchmark. Costs more than an index fund.
  aliases: [active funds, actively managed]
  lesson: m7-costs-index
- term: Direct plan
  def: The version of a mutual fund bought without a distributor. No commission, so a lower expense ratio.
  aliases: [direct plans]
  lesson: m7-costs-index
- term: Regular plan
  def: The version of a fund sold through a distributor; its expense ratio includes yearly commission.
  aliases: [regular plans]
  lesson: m7-costs-index
- term: Base expense ratio (BER)
  def: From April 2026, the AMC's management fee shown separately from brokerage and taxes. TER is the total of all.
  lesson: m7-costs-index
- term: Exit load
  def: A fee for redeeming within a set period, e.g. 1% if sold within a year.
  aliases: [exit loads]
  lesson: m7-costs-index
- term: Tracking error
  def: How much an index fund's return differs from its index. Lower is better.
  lesson: m7-costs-index
- term: SPIVA
  def: S&P's twice-yearly scorecard comparing active funds with their benchmark indices.
  lesson: m7-costs-index
- term: Rupee-cost averaging
  def: Investing a fixed amount regularly, so more units are bought when prices are low and fewer when high.
  aliases: [rupee cost averaging]
  lesson: m7-sip-behaviour
- term: Lump sum
  def: Investing a large amount all at once, as opposed to in instalments.
  aliases: [lumpsum]
  lesson: m7-sip-behaviour
- term: STP (Systematic Transfer Plan)
  def: Moving a fixed amount regularly from one fund (often liquid) to another (often equity).
  lesson: m7-sip-behaviour
- term: XIRR
  def: The true yearly return for investments made on different dates (like SIPs). Shown in your CAS and apps.
  lesson: m7-sip-behaviour
- term: Behaviour gap
  def: The difference between a fund's return and what investors actually earn, because they buy high and sell low.
  aliases: [behavior gap]
  lesson: m7-sip-behaviour
- term: Factsheet
  def: "A fund's monthly report: objective, costs, holdings, sector mix, risk and returns vs benchmark."
  aliases: [factsheets]
  lesson: m7-factsheet-start
- term: SID / KIM
  def: The legal documents of a scheme. SID = Scheme Information Document; KIM = Key Information Memorandum (a summary).
  lesson: m7-factsheet-start
- term: Growth option
  def: A fund option where gains stay invested and compound. Best for long-term goals.
  lesson: m7-factsheet-start
- term: IDCW
  def: Income Distribution cum Capital Withdrawal (formerly "dividend"). Pays out part of your own NAV; taxed at your slab.
  lesson: m7-factsheet-start
- term: Folio
  def: Your account number with a mutual fund house. One folio can hold several of its schemes.
  aliases: [folios]
  lesson: m7-factsheet-start
- term: CAS (Consolidated Account Statement)
  def: One statement listing all your mutual fund (and demat) holdings across fund houses.
  aliases: [Consolidated Account Statement]
  lesson: m7-factsheet-start
- term: KRA (KYC Registration Agency)
  def: Holds your investment KYC so you complete it once for all fund houses and brokers.
  lesson: m7-factsheet-start
- term: ARN
  def: AMFI Registration Number, which every mutual fund distributor must have.
  lesson: m7-factsheet-start
- term: SEBI RIA (Registered Investment Adviser)
  def: An adviser registered with SEBI who charges you a fee for advice and can't take commissions on what they recommend.
  aliases: [registered investment adviser, fee-only adviser, investment adviser]
  lesson: m7-factsheet-start
- term: Portfolio turnover
  def: How much of a fund's holdings are bought and sold in a year. High turnover means more trading costs.
  lesson: m7-factsheet-start
- term: MF Central
  def: A common platform by the registrars CAMS and KFintech to view, transact and get statements for all your mutual funds.
  lesson: m7-factsheet-start

# ---- Module 8: other instruments ----
- term: Small savings schemes
  def: Government-backed savings products (PPF, NSC, KVP, SCSS, MIS, Sukanya Samriddhi, post office deposits) with rates reset every quarter.
  aliases: [small savings, post office schemes]
  lesson: m8-safe-income
- term: NSC (National Savings Certificate)
  def: A 5-year government savings certificate; interest compounds yearly, is paid at maturity and is taxable.
  lesson: m8-safe-income
- term: KVP (Kisan Vikas Patra)
  def: A government savings certificate that doubles your money over a fixed period set by the current rate.
  lesson: m8-safe-income
- term: SCSS (Senior Citizens' Savings Scheme)
  def: A 5-year government scheme for people 60+ paying quarterly, taxable interest. Useful for retired parents.
  lesson: m8-safe-income
- term: Post Office MIS
  def: Post Office Monthly Income Scheme. A 5-year deposit paying interest every month.
  aliases: [Monthly Income Scheme]
  lesson: m8-safe-income
- term: Sukanya Samriddhi
  def: A government savings scheme for a girl child's education and marriage, with tax-free interest.
  aliases: [Sukanya Samriddhi Yojana, SSY]
  lesson: m8-safe-income
- term: Corporate FD
  def: A fixed deposit with a company or NBFC. Pays more than a bank FD but has no DICGC insurance.
  aliases: [company FD, NBFC FD, corporate FDs]
  lesson: m8-safe-income
- term: Credit rating
  def: A rating agency's opinion (AAA highest to D for default) of how likely an issuer is to repay.
  aliases: [credit ratings, rating agency]
  lesson: m8-bonds-reits-rest
- term: Floating Rate Savings Bonds
  def: A 7-year RBI/government bond whose rate resets every six months, set above the NSC rate. Interest is taxable.
  aliases: [RBI bonds]
  lesson: m8-safe-income
- term: PPF (Public Provident Fund)
  def: A 15-year government-backed account (₹500–₹1.5 lakh a year) with tax-free interest set quarterly.
  lesson: m8-ppf-epf
- term: NPS (National Pension System)
  def: A PFRDA-regulated, low-cost retirement account investing in equity and bonds; largely locked until retirement.
  aliases: [National Pension Scheme]
  lesson: m8-nps
- term: PRAN
  def: Permanent Retirement Account Number, your unique NPS account number.
  lesson: m8-nps
- term: Tier I / Tier II
  def: NPS Tier I is the locked pension account with tax benefits; Tier II is an optional flexible account.
  aliases: [Tier I, Tier II]
  lesson: m8-nps
- term: Annuity
  def: A product bought from an insurer with a lump sum that pays a regular pension, usually for life. Payouts are taxable.
  aliases: [annuities]
  lesson: m8-nps
- term: Auto choice
  def: An NPS option that automatically shifts your mix from equity to bonds as you age (lifecycle fund).
  aliases: [lifecycle fund]
  lesson: m8-nps
- term: Gold ETF
  def: A SEBI-regulated fund that holds physical gold and trades on the stock exchange like a share.
  aliases: [gold ETFs, gold fund, gold mutual fund]
  lesson: m8-gold
- term: SGB (Sovereign Gold Bond)
  def: A government bond linked to the gold price that also paid fixed interest. No new issues since February 2024; existing ones trade on exchanges.
  aliases: [Sovereign Gold Bonds, SGBs]
  lesson: m8-gold
- term: Digital gold
  def: Gold sold in small amounts by apps and stored by a vault company. Not regulated by SEBI or RBI.
  lesson: m8-gold
- term: HUID
  def: A 6-digit Hallmark Unique Identification code on BIS-hallmarked gold, used to verify purity.
  aliases: [hallmark, hallmarked]
  lesson: m8-gold
- term: Making charges
  def: The jeweller's charge for crafting jewellery, often 8–25% of gold value, lost when you sell.
  lesson: m8-gold
- term: RBI Retail Direct
  def: RBI's platform for individuals to buy government bonds and treasury bills directly.
  lesson: m8-bonds-reits-rest
- term: Corporate bond
  def: A bond issued by a company. Pays more than government bonds because of credit risk.
  aliases: [corporate bonds]
  lesson: m8-bonds-reits-rest
- term: REIT
  def: Real Estate Investment Trust. Owns rent-earning property and pays out most of its cash to unitholders; trades on exchanges.
  aliases: [REITs]
  lesson: m8-bonds-reits-rest
- term: InvIT
  def: Infrastructure Investment Trust. Owns assets like toll roads or power lines and distributes most of their cash.
  aliases: [InvITs]
  lesson: m8-bonds-reits-rest
- term: P2P lending
  def: Lending to individuals through an RBI-registered peer-to-peer platform. Defaults happen; returns aren't assured.
  aliases: [peer-to-peer lending, P2P]
  lesson: m8-bonds-reits-rest
- term: Crypto
  def: Digital tokens like Bitcoin. Not legal tender in India, heavily taxed, and extremely volatile.
  aliases: [cryptocurrency, crypto assets, VDA]
  lesson: m8-bonds-reits-rest
- term: Ladder
  def: Splitting money into FDs or bonds maturing in different years, for regular access and averaged rates.
  aliases: [FD ladder, bond ladder]
  lesson: m8-bonds-reits-rest

# ---- Module 9: how businesses work ----
- term: Revenue
  def: Money a company earns from selling its goods or services, before any costs. Also called sales or turnover.
  aliases: [sales, turnover, top line]
  lesson: m9-business-models
- term: Fixed costs
  def: Costs that don't change with sales volume, like rent and most salaries.
  aliases: [fixed cost]
  lesson: m9-business-models
- term: Variable costs
  def: Costs that rise with each unit sold, like raw materials and delivery.
  aliases: [variable cost]
  lesson: m9-business-models
- term: Profit margin
  def: Profit as a % of revenue. Can be measured at different levels (EBITDA margin, net margin).
  aliases: [margin, margins, net margin, operating margin, EBITDA margin]
  lesson: m9-business-models
- term: Operating leverage
  def: When high fixed costs make profits rise or fall much faster than sales.
  lesson: m9-business-models
- term: Moat
  def: A durable competitive advantage (brand, network effects, switching costs, lowest cost) that protects profits.
  aliases: [moats, competitive advantage]
  lesson: m9-business-models
- term: Unit economics
  def: Whether one sale or customer is profitable after the costs it directly causes.
  lesson: m9-business-models
- term: P&L (Profit and loss statement)
  def: The financial statement showing revenue, expenses and profit over a period. Also called the income statement.
  aliases: [income statement, profit and loss]
  lesson: m9-pnl
- term: EBITDA
  def: Earnings Before Interest, Taxes, Depreciation and Amortisation. Operating profit before asset and debt costs.
  lesson: m9-pnl
- term: EBIT
  def: Earnings Before Interest and Taxes, i.e. operating profit after depreciation.
  aliases: [operating profit]
  lesson: m9-pnl
- term: PBT (Profit Before Tax)
  def: Profit after all expenses including interest, before income tax.
  lesson: m9-pnl
- term: PAT (Profit After Tax)
  def: Net profit, what's left for shareholders after all expenses and taxes.
  aliases: [net profit, bottom line]
  lesson: m9-pnl
- term: EPS (Earnings Per Share)
  def: Net profit ÷ number of shares outstanding. (In salary/PF context, EPS instead means the Employees' Pension Scheme.)
  lesson: m9-pnl
- term: Depreciation
  def: Spreading the cost of a long-lasting asset over its useful life as a yearly expense; also the fall in an asset's value with age.
  lesson: m9-pnl
- term: Exceptional items
  def: One-time gains or losses (asset sales, write-offs, settlements) that can distort a single year's profit.
  aliases: [one-time items, exceptional item, one-offs]
  lesson: m9-pnl
- term: Consolidated results
  def: Financial results of a company together with its subsidiaries. Usually the right figures to analyse.
  aliases: [consolidated]
  lesson: m9-pnl
- term: Balance sheet
  def: A snapshot of what a company owns (assets) and owes (liabilities) and its shareholders' equity on a given date.
  lesson: m9-balance-cash
- term: Shareholders' equity
  def: Assets minus liabilities, the book value belonging to shareholders. Also called net worth or book value.
  aliases: [book value, shareholders equity, net worth (company)]
  lesson: m9-balance-cash
- term: Receivables
  def: Money customers owe a company for goods or services already delivered.
  aliases: [debtors, trade receivables]
  lesson: m9-balance-cash
- term: Payables
  def: Money a company owes its suppliers for goods or services already received.
  aliases: [creditors, trade payables]
  lesson: m9-balance-cash
- term: Inventory
  def: Raw materials and goods a company holds but hasn't yet sold.
  aliases: [stock in trade]
  lesson: m9-balance-cash
- term: Working capital
  def: Cash tied up in day-to-day operations, roughly inventory plus receivables minus payables.
  lesson: m9-balance-cash
- term: Cash flow statement
  def: Shows actual cash in and out over a period, split into operating, investing and financing activities.
  lesson: m9-balance-cash
- term: Operating cash flow
  def: Cash generated by a company's core business in a period. Should broadly track profit over time.
  aliases: [cash from operations, CFO]
  lesson: m9-balance-cash
- term: Free cash flow
  def: Operating cash flow minus capital expenditure. Cash truly available for debt repayment, dividends or growth.
  aliases: [FCF]
  lesson: m9-balance-cash
- term: ROE (Return on Equity)
  def: Net profit ÷ shareholders' equity. Profit earned on shareholders' money.
  lesson: m9-ratios-reports
- term: ROCE (Return on Capital Employed)
  def: EBIT ÷ (equity + debt). Profit earned on all capital invested in the business.
  lesson: m9-ratios-reports
- term: Debt-to-equity
  def: Borrowings ÷ shareholders' equity. A measure of how much a company relies on debt.
  aliases: [debt to equity, D/E]
  lesson: m9-ratios-reports
- term: Interest coverage
  def: EBIT ÷ interest expense. How many times operating profit covers interest; low means risky debt.
  aliases: [interest coverage ratio]
  lesson: m9-ratios-reports
- term: P/E ratio
  def: Share price ÷ EPS. How much investors pay for each rupee of yearly profit.
  aliases: [P/E, price-to-earnings, PE ratio]
  lesson: m9-ratios-reports
- term: P/B ratio
  def: Share price ÷ book value per share.
  aliases: [P/B, price-to-book]
  lesson: m9-ratios-reports
- term: Dividend
  def: A share of a company's profit paid to shareholders in cash, decided by the board.
  aliases: [dividends]
  lesson: m9-ratios-reports
- term: Dividend yield
  def: Dividend per share ÷ share price, as a %.
  lesson: m9-ratios-reports
- term: Promoter
  def: The founder or controlling group of a listed company.
  aliases: [promoters, promoter holding]
  lesson: m9-ratios-reports
- term: Pledged shares
  def: Shares promoters have used as security for loans. Lenders may sell them if the price falls.
  aliases: [pledge, pledges]
  lesson: m9-ratios-reports
- term: Shareholding pattern
  def: Quarterly disclosure of who owns a listed company's shares (promoters, funds, foreign investors, public).
  lesson: m9-ratios-reports
- term: Annual report
  def: A listed company's yearly report with the business review (MD&A), audited financial statements and notes.
  aliases: [annual reports]
  lesson: m9-ratios-reports
- term: MD&A
  def: Management Discussion and Analysis, the section of the annual report where management explains results, risks and plans.
  lesson: m9-ratios-reports
- term: Auditor's report
  def: The independent auditor's opinion on the financial statements. Qualifications or resignations are warning signs.
  aliases: [auditor]
  lesson: m9-balance-cash
- term: Related-party transactions
  def: Deals between a company and its promoters, their relatives or their other businesses. Large ones need scrutiny.
  aliases: [related party transactions]
  lesson: m9-balance-cash

# ---- Module 10: stock market ----
- term: Stock exchange
  def: The regulated marketplace where listed shares are bought and sold. India's main ones are NSE and BSE.
  aliases: [stock exchanges]
  lesson: m10-how-markets-work
- term: NSE / BSE
  def: National Stock Exchange and BSE (formerly Bombay Stock Exchange), India's two main stock exchanges.
  aliases: [NSE, BSE]
  lesson: m10-how-markets-work
- term: Sensex
  def: BSE's index of 30 large companies.
  lesson: m10-how-markets-work
- term: Broker
  def: A SEBI-registered firm that places your buy and sell orders on the exchange.
  aliases: [stockbroker, brokers]
  lesson: m10-how-markets-work
- term: Demat account
  def: An electronic account that holds your shares and securities at a depository (NSDL or CDSL).
  aliases: [demat]
  lesson: m10-how-markets-work
- term: NSDL / CDSL
  def: India's two depositories, which hold securities electronically for investors.
  aliases: [NSDL, CDSL, depository, depositories]
  lesson: m10-how-markets-work
- term: T+1 settlement
  def: Shares and money change hands one working day after the trade.
  aliases: [T+1]
  lesson: m10-how-markets-work
- term: IPO (Initial Public Offering)
  def: A company's first sale of shares to the public, after which they list on an exchange.
  aliases: [IPOs]
  lesson: m10-how-markets-work
- term: Offer for sale
  def: The part of an IPO where existing shareholders sell their shares. The money goes to them, not the company.
  aliases: [OFS]
  lesson: m10-how-markets-work
- term: STT (Securities Transaction Tax)
  def: A small tax charged on buying and selling shares and derivatives on Indian exchanges.
  lesson: m10-how-markets-work
- term: Valuation
  def: What a business is worth, or how expensive its share is relative to profits, book value or cash flows.
  lesson: m10-valuation
- term: Value trap
  def: A share that looks cheap on ratios because the business is declining, so it stays cheap or falls further.
  lesson: m10-valuation
- term: Margin of safety
  def: Buying well below your estimate of value, to allow for mistakes in that estimate.
  lesson: m10-valuation
- term: Company-specific risk
  def: Risk from events affecting one company (fraud, failure, debt). Largely removed by diversification.
  aliases: [unsystematic risk]
  lesson: m10-stock-risk
- term: Market risk
  def: Risk that affects almost all shares together (recessions, rate shocks). Can't be diversified away within equity.
  aliases: [systematic risk]
  lesson: m10-stock-risk
- term: Drawdown
  def: The fall from a peak to a low in an investment's value, usually shown as a %.
  aliases: [drawdowns]
  lesson: m10-stock-risk
- term: Survivorship bias
  def: Drawing conclusions only from winners that survived, ignoring the many that failed.
  lesson: m10-stock-risk
- term: Core and satellite
  def: Keeping most money in a broad, low-cost core (index funds) and a small, capped portion in individual picks.
  lesson: m10-stock-risk
- term: Limit order
  def: An order to buy or sell only at a price you set or better.
  aliases: [limit orders]
  lesson: m10-buying-responsibly
- term: Market order
  def: An order to buy or sell immediately at the best available price.
  aliases: [market orders]
  lesson: m10-buying-responsibly
- term: Bonus issue
  def: Free extra shares given to shareholders in a ratio. Same total value, more shares.
  aliases: [bonus shares]
  lesson: m10-buying-responsibly
- term: Stock split
  def: Splitting each share into several of lower price. Same total value.
  aliases: [stock splits]
  lesson: m10-buying-responsibly
- term: Buyback
  def: A company buying back its own shares, returning cash to sellers and raising remaining holders' share of ownership.
  aliases: [buybacks, share buyback]
  lesson: m10-buying-responsibly
- term: Record date
  def: The date on which you must hold shares to receive a dividend, bonus or other corporate action.
  aliases: [ex-date]
  lesson: m10-buying-responsibly
- term: Pump-and-dump
  def: Hyping a thinly traded share to push its price up, then selling to the buyers attracted. Illegal market manipulation.
  aliases: [pump and dump]
  lesson: m10-buying-responsibly
- term: Paper trading
  def: Practising investing with imaginary money and a written journal before risking real money.
  aliases: [paper portfolio]
  lesson: m10-buying-responsibly

# ---- Module 11: trading & derivatives ----
- term: Intraday trading
  def: Buying and selling within the same day, closing positions before the market shuts. Taxed as speculative business income.
  aliases: [intraday]
  lesson: m11-trading-vs-investing
- term: Zero-sum
  def: When one participant's gain is another's loss. Short-term trading is roughly zero-sum before costs, negative after.
  aliases: [negative-sum]
  lesson: m11-trading-vs-investing
- term: F&O (Futures and Options)
  def: Derivative contracts on shares and indices traded on exchanges. SEBI found about 91% of individual F&O traders lost money in FY25.
  aliases: [derivatives trading, F&O trading]
  lesson: m11-fo-explained
- term: Derivative
  def: A contract whose value depends on an underlying asset like a share, index, currency or commodity.
  aliases: [derivatives]
  lesson: m11-fo-explained
- term: Futures contract
  def: An agreement to buy or sell an asset at a set price on a future date, traded with margin and settled daily.
  aliases: [futures]
  lesson: m11-fo-explained
- term: Leverage
  def: Controlling a large position with a small amount of your own money, magnifying gains and losses.
  aliases: [leveraged]
  lesson: m11-fo-explained
- term: Trading margin
  def: The deposit required to hold a leveraged position like futures or sold options.
  aliases: [margin money, margin call]
  lesson: m11-fo-explained
- term: Mark-to-market
  def: Daily settlement of gains and losses on futures based on that day's closing price.
  aliases: [MTM]
  lesson: m11-fo-explained
- term: Call option
  def: The right, not the obligation, to buy an asset at a set strike price before expiry.
  aliases: [call options]
  lesson: m11-fo-explained
- term: Put option
  def: The right, not the obligation, to sell an asset at a set strike price before expiry.
  aliases: [put options, puts]
  lesson: m11-fo-explained
- term: Strike price
  def: The price at which an option lets you buy (call) or sell (put).
  aliases: [strike]
  lesson: m11-fo-explained
- term: Option premium
  def: The price an option buyer pays the seller. The buyer's maximum loss.
  lesson: m11-fo-explained
- term: Expiry
  def: The date a futures or options contract ends.
  aliases: [expiry day, weekly expiry]
  lesson: m11-fo-explained
- term: Time decay
  def: The daily loss in an option's value as expiry approaches, all else equal. Works against buyers.
  aliases: [theta]
  lesson: m11-fo-explained
- term: Hedging
  def: Taking a position that offsets possible losses on something you already own, like insurance.
  aliases: [hedge]
  lesson: m11-fo-explained
- term: Speculative business income
  def: How intraday share trading profits are classified for tax, with restricted loss set-off rules.
  lesson: m11-if-you-trade
- term: ITR-3
  def: The income tax return form for individuals with business or professional income, including F&O and intraday trading.
  lesson: m11-if-you-trade

# ---- Module 12: taxes ----
- term: Income-tax Act, 2025
  def: The law governing income tax from 1 April 2026, replacing the 1961 Act with simpler language and new section numbers.
  aliases: [Income-tax Act 2025, new Act]
  lesson: m12-how-tax-works
- term: Slab rate
  def: The tax rate for one band of income. Rates are marginal, applying only to income within each band.
  aliases: [slab, slabs, tax slab, tax slabs, marginal rate]
  lesson: m12-how-tax-works
- term: Rebate
  def: A reduction that makes tax nil up to a threshold. ₹12 lakh of taxable income in the new regime, ₹5 lakh in the old.
  aliases: [tax rebate]
  lesson: m12-how-tax-works
- term: Cess
  def: An extra 4% health and education cess charged on the income tax amount.
  lesson: m12-how-tax-works
- term: Surcharge
  def: An additional tax on the tax for very high incomes.
  lesson: m12-how-tax-works
- term: Standard deduction
  def: A flat deduction from salary income. ₹75,000 in the new regime, ₹50,000 in the old.
  lesson: m12-how-tax-works
- term: Income from other sources
  def: Taxable income like savings and FD interest, dividends and gifts above limits, outside salary, business, property and capital gains.
  aliases: [other sources]
  lesson: m12-how-tax-works
- term: New tax regime
  def: The default regime with lower slab rates and a ₹12 lakh rebate but few deductions.
  aliases: [new regime]
  lesson: m12-old-vs-new
- term: Old tax regime
  def: The optional regime with higher rates but many deductions (section 123/old 80C, health insurance, HRA, home-loan interest).
  aliases: [old regime]
  lesson: m12-old-vs-new
- term: Section 123 (old 80C)
  def: The deduction of up to ₹1.5 lakh for EPF, PPF, ELSS, life insurance premium, home-loan principal and more. Old regime only.
  aliases: [80C, section 80C, section 123]
  lesson: m12-old-vs-new
- term: Section 126 (old 80D)
  def: The deduction for health insurance premiums for yourself, family and parents. Old regime only.
  aliases: [80D, section 80D, section 126]
  lesson: m12-old-vs-new
- term: Capital gains
  def: Profit from selling an investment or asset for more than you paid. Short-term or long-term depending on holding period.
  aliases: [capital gain]
  lesson: m12-investment-tax
- term: STCG (short-term capital gain)
  def: Gain on an asset held for a short period. For listed equity, 12 months or less, taxed at 20%.
  aliases: [short-term capital gains, short-term gain, short-term gains]
  lesson: m12-investment-tax
- term: LTCG (long-term capital gain)
  def: Gain on an asset held longer. For listed equity, over 12 months, taxed at 12.5% above ₹1.25 lakh a year.
  aliases: [long-term capital gains, long-term gain, long-term gains]
  lesson: m12-investment-tax
- term: Tax-gain harvesting
  def: Selling and rebuying equity investments to book long-term gains within the yearly exemption, resetting cost higher.
  aliases: [gain harvesting]
  lesson: m12-investment-tax
- term: Tax-loss harvesting
  def: Booking losses to offset taxable gains, within set-off rules.
  aliases: [loss harvesting]
  lesson: m12-investment-tax
- term: Carry forward losses
  def: Using a capital loss against gains in later years (up to 8 years), allowed only if the return is filed on time.
  aliases: [carry forward, set-off, set off]
  lesson: m12-investment-tax
- term: ITR-1 / ITR-2
  def: Income tax return forms. ITR-1 (Sahaj) for simple salary cases; ITR-2 for capital gains beyond ITR-1's limits, foreign assets and more.
  aliases: [ITR-1, ITR-2, Sahaj]
  lesson: m12-filing
- term: E-verification
  def: Confirming a filed return electronically (Aadhaar OTP, net banking). An unverified return is treated as not filed.
  aliases: [e-verify, e-verified]
  lesson: m12-filing
- term: Revised return
  def: A corrected return filed after the original, within the allowed time.
  aliases: [updated return, ITR-U]
  lesson: m12-filing
- term: Advance tax
  def: Tax paid in instalments during the year on income where TDS doesn't cover enough (e.g. large gains, freelance income).
  lesson: m12-filing

# ---- Module 13: goals & planning ----
- term: Goal-based investing
  def: Linking each investment to a specific goal with an amount and date, and choosing instruments by time horizon.
  lesson: m13-goals-to-numbers
- term: Time horizon
  def: How long until you need the money. It decides how much risk the money can take.
  aliases: [horizon]
  lesson: m13-goals-to-numbers
- term: Corpus
  def: The total amount of money built up for a goal, such as a retirement or self-funding pot.
  aliases: [pot]
  lesson: m13-goals-to-numbers
- term: Pay yourself first
  def: Automatically moving savings and investments out on salary day before spending.
  lesson: m13-money-system
- term: 50/30/20 rule
  def: A starting budget split of roughly 50% needs, 30% wants and 20%+ savings.
  aliases: [50-30-20]
  lesson: m13-money-system
- term: Lifestyle creep
  def: Spending rising with each raise so savings don't grow even as income does.
  aliases: [lifestyle inflation]
  lesson: m13-money-system
- term: Rental yield
  def: Yearly rent ÷ property price. Often 2–4% in large Indian cities.
  lesson: m13-big-purchases
- term: Opportunity cost
  def: The return you give up by using money one way instead of another, e.g. a down payment not invested.
  lesson: m13-big-purchases
- term: Down payment
  def: The part of a purchase price paid upfront from your own money, with the rest borrowed.
  lesson: m13-big-purchases
- term: Stamp duty
  def: A state tax on property purchases, paid with registration charges. Varies by state.
  aliases: [registration charges]
  lesson: m13-big-purchases
- term: RERA
  def: Real Estate (Regulation and Development) Act. Builders must register projects with the state RERA authority; check before buying.
  lesson: m13-big-purchases
- term: Withdrawal rate
  def: The share of an investment pot you take out each year. Lower rates (3–4%) are safer for long periods.
  aliases: [safe withdrawal rate]
  lesson: m13-self-funding
- term: Sequence risk
  def: The danger that poor returns early in a withdrawal period deplete a pot even if later returns are good.
  aliases: [sequence of returns risk]
  lesson: m13-self-funding
- term: Passive income
  def: Income from investments or assets that doesn't need ongoing work, usually only after building a large pot over years.
  lesson: m13-self-funding

# ---- Module 14: portfolio & behaviour ----
- term: Asset allocation
  def: How your money is split between equity, debt, gold and cash. Drives most of a portfolio's risk and return.
  aliases: [allocation]
  lesson: m14-asset-allocation
- term: Risk capacity
  def: How much loss your finances can absorb without derailing goals (job stability, dependants, time horizon).
  lesson: m14-asset-allocation
- term: Risk tolerance
  def: How much loss you can emotionally sit through without abandoning the plan.
  lesson: m14-asset-allocation
- term: Glide path
  def: Gradually shifting a goal's money from equity to safer assets as the goal date approaches.
  lesson: m14-asset-allocation
- term: Rebalancing
  def: Bringing a portfolio back to its target allocation after market moves, by rule rather than by forecast.
  aliases: [rebalance]
  lesson: m14-rebalancing
- term: Loss aversion
  def: Feeling losses about twice as strongly as equal gains, which drives panic selling and holding losers.
  lesson: m14-behaviour
- term: Recency bias
  def: Assuming recent results will continue, e.g. chasing last year's best fund.
  lesson: m14-behaviour
- term: Herding
  def: Following what everyone else is doing with money, often buying near peaks. FOMO is its feeling.
  aliases: [herd behaviour, FOMO]
  lesson: m14-behaviour
- term: Overconfidence
  def: Mistaking luck or a short winning streak for skill, leading to excess trading and risk.
  lesson: m14-behaviour
- term: Anchoring
  def: Fixating on a reference number (like your purchase price) when making a decision now.
  lesson: m14-behaviour
- term: Mental accounting
  def: Treating money differently by label or source, such as spending a bonus freely while paying expensive debt.
  lesson: m14-behaviour
- term: Sunk cost fallacy
  def: Continuing something because of what you've already put in, rather than its future costs and benefits.
  aliases: [sunk cost]
  lesson: m14-behaviour
- term: Investment policy
  def: A one-page written plan of your goals, allocation, rebalancing rule and the things you'll never do.
  aliases: [investment policy statement]
  lesson: m14-behaviour

# ---- Module 15: crashes, bubbles & history ----
- term: Bubble
  def: When prices rise far above any reasonable value on stories, easy money and FOMO, before falling sharply.
  aliases: [bubbles, asset bubble]
  lesson: m15-global-bubbles
- term: Bank receipt
  def: An instrument banks used to settle government-securities trades in the early 1990s; misused in the 1992 securities scam.
  aliases: [bank receipts, BR]
  lesson: m15-india-scams
- term: AT1 bonds
  def: Additional Tier 1 bonds, riskier perpetual bonds issued by banks that can be written off in a crisis. Not deposits, not insured.
  aliases: [AT1, perpetual bonds]
  lesson: m15-credit-crises
- term: Bank moratorium
  def: When RBI temporarily restricts a troubled bank's operations, often capping withdrawals while a rescue is arranged.
  lesson: m15-credit-crises
- term: Cooperative bank
  def: A bank owned by its members, regulated jointly by RBI and state registrars. Deposits are DICGC-insured, but several weak ones have failed.
  aliases: [cooperative banks, co-operative bank]
  lesson: m15-credit-crises
- term: Global financial crisis
  def: The 2007–09 crisis triggered by bad US housing loans and leverage, including the collapse of Lehman Brothers.
  aliases: [2008 crisis, GFC]
  lesson: m15-global-bubbles

# ---- Module 16: bigger life topics ----
- term: Retirement corpus
  def: The total investments needed at retirement to fund your expenses for life, often estimated as yearly expenses ÷ a cautious withdrawal rate.
  aliases: [retirement fund]
  lesson: m16-retirement
- term: FIRE
  def: Financial Independence, Retire Early. Building a corpus of roughly 30–40× yearly expenses to stop working early.
  lesson: m16-retirement
- term: ESOP
  def: Employee Stock Option Plan. The right to buy employer shares at a fixed price after vesting.
  aliases: [ESOPs, stock options]
  lesson: m16-esops-rsus
- term: RSU
  def: Restricted Stock Unit. Employer shares given to you as they vest, taxed as salary at vesting.
  aliases: [RSUs]
  lesson: m16-esops-rsus
- term: Vesting
  def: When equity grants (ESOPs, RSUs) become yours, usually spread over several years.
  aliases: [vest, vests, vested]
  lesson: m16-esops-rsus
- term: Perquisite
  def: A non-cash benefit from an employer taxed as salary, such as RSUs at vesting or ESOPs at exercise.
  aliases: [perquisites, perk]
  lesson: m16-esops-rsus
- term: Foreign assets schedule
  def: The section of the income tax return (Schedule FA) where residents disclose foreign shares, accounts and other assets.
  aliases: [Schedule FA]
  lesson: m16-esops-rsus
- term: Legal heir
  def: A person entitled to inherit under a will or the applicable succession law.
  aliases: [legal heirs, heirs]
  lesson: m16-wills-nominees
- term: Beneficial nominee
  def: In life insurance, a spouse, child or parent named as nominee who receives the claim money outright.
  lesson: m16-wills-nominees
- term: Will
  def: A written, signed and witnessed document stating who inherits your assets. Registration is optional.
  aliases: [wills]
  lesson: m16-wills-nominees
- term: Executor
  def: The person named in a will to carry out its instructions.
  lesson: m16-wills-nominees
- term: Succession law
  def: The law that decides inheritance when there's no will, depending on the person's personal law (e.g. Hindu Succession Act).
  aliases: [succession]
  lesson: m16-wills-nominees
- term: Family file
  def: A single document listing your accounts, policies, investments, nominees and where the will is, so family can find everything.
  lesson: m16-wills-nominees
- term: Child plan
  def: An insurance product marketed for children's future, usually endowment- or ULIP-style. Term cover plus separate investing usually does better.
  aliases: [child plans, child education plan]
  lesson: m16-partner-children
