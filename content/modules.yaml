# Course map. `id` is what lessons use in their `module:` field; modules show in this order.
- id: 0
  title: "Start here: money from zero"
  blurb: What banks do, account types, debit vs credit cards, UPI, and the everyday money words everything else assumes.
  status: ready
- id: 1
  title: Money basics
  blurb: Inflation, compounding, net worth, budgeting. The foundation everything else uses.
  status: ready
- id: 2
  title: Your salary
  blurb: CTC vs in-hand, payslip, EPF, gratuity, TDS, Form 16/130, AIS. Money you already earn.
  status: ready
- id: 3
  title: Banking & staying safe
  blurb: Accounts, UPI, cards, credit score, fraud and how to complain.
  status: ready
- id: 4
  title: Loans, in depth
  blurb: EMI mechanics, every major loan type in India, traps, and how to compare offers.
  status: ready
- id: 5
  title: Insurance
  blurb: Term, health, motor, home. What you need vs what gets mis-sold.
  status: ready
- id: 6
  title: How the economy works
  blurb: RBI and the repo rate, inflation, GDP, the Union Budget, the rupee and the dollar, and why all of it reaches your EMI and FD.
  status: ready
- id: 7
  title: Mutual funds
  blurb: NAV, SIP, index vs active, direct vs regular, reading a factsheet and CAS.
  status: ready
- id: 8
  title: Other instruments
  blurb: FDs and post office schemes, PPF/EPF/VPF, NPS, gold and silver, bonds, REITs/InvITs, and the risky edges (P2P, crypto).
  status: ready
- id: 9
  title: How businesses work
  blurb: How companies make money, profit vs cash, and reading a balance sheet, P&L and cash flow statement.
  status: ready
- id: 10
  title: Stock market
  blurb: Exchanges, brokers, demat and IPOs; price vs value; single-stock risk; corporate actions, tips and paper trading.
  status: ready
- id: 11
  title: Trading & derivatives
  blurb: Intraday, F&O, costs, and SEBI's data on how retail traders actually do.
  status: ready
- id: 12
  title: Taxes
  blurb: The Income-tax Act, 2025, slabs and rebate, old vs new regime maths, taxes on investments, and filing your own return.
  status: ready
- id: 13
  title: Goals & planning
  blurb: Turn goals into amounts, dates and SIPs; your money system and emergency fund; rent vs buy; making recurring extras self-funding.
  status: ready
- id: 14
  title: Portfolio & behaviour
  blurb: Asset allocation, rebalancing, the behavioural mistakes that cost the most, and a yearly review.
  status: ready
- id: 15
  title: Crashes, bubbles & money history
  blurb: Harshad Mehta, Ketan Parekh, Satyam; IL&FS, PMC, Yes Bank, Franklin; dot-com, 2008, COVID, crypto. What each teaches about risk.
