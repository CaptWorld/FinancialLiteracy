- id: p-inflation-1
  module: 1
  title: What will ₹50,000/month cost in 15 years?
  value: 119800
  unit: "₹"
  tolerance: 2
  question: Your monthly expenses are ₹50,000. If inflation averages 6%, what will the same lifestyle cost per month in 15 years?
  solution: |
    Future cost = today × (1 + inflation)^years
    = 50,000 × 1.06^15
    1.06^15 ≈ 2.397
    = 50,000 × 2.397 ≈ **₹1,19,800 per month**
    Your lifestyle cost more than doubles. Rule of 72 check: 72 ÷ 6 = 12 years to double, so 15 years is a bit more than double. ✔
  answer: About ₹1.2 lakh per month
  tool: compound
- id: p-real-1
  module: 1
  title: Real return of an FD after tax
  value: -1.0
  unit: "%"
  tolerance: 0
  abs_tolerance: 0.3
  question: An FD pays 7%. You're in a 30% tax slab (ignore cess). Inflation is 6%. What is your approximate real, after-tax return?
  solution: |
    After-tax interest = 7% × (1 − 0.30) = 4.9%
    Real return ≈ (1.049 ÷ 1.06) − 1 ≈ **−1.0%**
    You lose about 1% of buying power a year. FDs are fine for safety and short-term needs, not for long-term growth.
  answer: About −1% a year
  tool: compound
- id: p-compound-1
  module: 1
  title: Simple vs compound over 20 years
  value: 932200
  unit: "₹"
  tolerance: 2
  question: ₹2 lakh at 8% a year for 20 years. How much with simple interest vs yearly compounding?
  solution: |
    Simple: 2,00,000 + 2,00,000 × 0.08 × 20 = 2,00,000 + 3,20,000 = **₹5,20,000**
    Compound: 2,00,000 × 1.08^20 ≈ 2,00,000 × 4.661 = **₹9,32,200**
    Compounding adds over ₹4 lakh extra, and most of it comes in the later years.
  answer: ₹5.2 lakh simple vs ₹9.3 lakh compound
  tool: compound
- id: p-networth-1
  module: 1
  title: Compute a net worth
  value: 525000
  unit: "₹"
  tolerance: 0.5
  question: "Savings ₹1.8L, FD ₹1L, EPF ₹2.4L, mutual funds ₹60k, gold coins (resale) ₹40k. Owes: credit card ₹25k, bike loan outstanding ₹70k. Net worth?"
  solution: |
    Assets = 1,80,000 + 1,00,000 + 2,40,000 + 60,000 + 40,000 = ₹6,20,000
    Liabilities = 25,000 + 70,000 = ₹95,000
    Net worth = 6,20,000 − 95,000 = **₹5,25,000**
    Notice EPF is often the biggest asset for a young salaried person.
  answer: ₹5.25 lakh
- id: p-ctc-1
  module: 2
  title: From gross to in-hand
  value: 79500
  unit: "₹"
  tolerance: 0.5
  question: "Monthly gross ₹95,000. Employee PF ₹3,600. Professional tax ₹200. TDS ₹9,500. Meal card deduction ₹2,200. What's the in-hand?"
  solution: |
    In-hand = 95,000 − 3,600 − 200 − 9,500 − 2,200 = **₹79,500**
    The meal card isn't lost; it's paid as a meal benefit instead of cash.
  answer: ₹79,500
- id: p-gratuity-1
  module: 2
  title: Estimate your gratuity
  value: 207692
  unit: "₹"
  tolerance: 2
  question: Last drawn wages ₹60,000/month. You leave after 5 years 7 months. Estimate gratuity using the traditional 15/26 formula.
  solution: |
    Completed years: 5 years 7 months → counts as 6 (more than 6 months in the last year).
    Gratuity ≈ 60,000 × 15 ÷ 26 × 6 ≈ **₹2,07,692**
    Check your employer's policy and the current rules (Labour Codes FAQ) for the exact method and the cap.
  answer: About ₹2.08 lakh
- id: p-epf-1
  module: 2
  title: Should you withdraw ₹3 lakh PF on a job switch?
  value: 3260000
  unit: "₹"
  tolerance: 5
  question: You have ₹3 lakh in EPF at age 27. If it compounds at an assumed 8% a year until 58, roughly what could it become? (Use Tools → Compound.)
  solution: |
    Years = 58 − 27 = 31
    3,00,000 × 1.08^31 ≈ 3,00,000 × 10.87 ≈ **₹32.6 lakh**
    Withdrawing ₹3 lakh now gives up roughly ₹30 lakh later (in nominal rupees; less in today's money after inflation, but still large). Transfer, don't withdraw.
  answer: Roughly ₹32 lakh at 58
  tool: compound
- id: p-emi-1
  module: 3
  title: EMI on a ₹5 lakh personal loan
  value: 17089
  unit: "₹"
  tolerance: 1
  question: ₹5,00,000 at 14% a year for 3 years. What's the EMI and total interest?
  solution: |
    Monthly rate r = 14 ÷ 12 ÷ 100 = 0.011667, n = 36
    EMI = P × r × (1+r)^n ÷ ((1+r)^n − 1)
    (1.011667)^36 ≈ 1.5194
    EMI = 5,00,000 × 0.011667 × 1.5194 ÷ 0.5194 ≈ **₹17,089**
    Total paid = 17,089 × 36 ≈ ₹6,15,200 → interest ≈ **₹1,15,200**
  answer: EMI ≈ ₹17,089; interest ≈ ₹1.15 lakh
  tool: emi
- id: p-card-1
  module: 3
  title: The minimum-due trap
  value: 12600
  unit: "₹"
  tolerance: 1
  question: "Card balance ₹30,000. The card charges 3.5% a month. You pay nothing new but also only pay the interest each month. How much interest do you pay in a year?"
  solution: |
    Monthly interest = 3.5% × 30,000 = ₹1,050
    Yearly = 1,050 × 12 = **₹12,600**, and you still owe the full ₹30,000. Plus GST on the interest.
    Effective yearly rate if it compounds: 1.035^12 − 1 ≈ 51%.
  answer: ₹12,600 a year (and the debt remains)
  tool: compound
- id: p-sip-1
  module: 1
  title: Cost of a 1% higher expense ratio
  value: 446000
  unit: "₹"
  tolerance: 10
  question: "₹5,000/month SIP for 20 years. Fund earns 11% before costs. Plan A costs 0.2% a year, Plan B 1.2%. Difference at the end? (Use Tools → SIP's cost comparison.)"
  solution: |
    Plan A grows at ≈ 10.8%, Plan B at ≈ 9.8%.
    Using the SIP tool (start-of-month investing), A ends around ₹39.8 lakh and B around ₹35.4 lakh.
    The difference is about **₹4.5 lakh**, from the same fund idea with just higher costs. You invested ₹12 lakh in both. This is why direct plans and low costs matter (Module 6).
  answer: About ₹4.5 lakh less with the costlier plan
  tool: sip

# ---- Module 0 ----
- id: p-m0-savings-interest
  module: 0
  title: How much interest did Arjun's savings account earn?
  value: 301
  unit: "₹"
  tolerance: 2
  question: Arjun's savings account pays 3% p.a., calculated on the daily balance. In a 92-day quarter he had ₹50,000 for the first 45 days and ₹30,000 for the remaining 47 days. Roughly how much interest does he get for the quarter?
  solution: |
    Day's interest = balance × rate ÷ 365
    First part: 50,000 × 0.03 × 45 ÷ 365 ≈ ₹184.9
    Second part: 30,000 × 0.03 × 47 ÷ 365 ≈ ₹115.9
    Total ≈ **₹301 for the quarter**, about ₹1,200 a year on ~₹40,000.
    That's why a savings account is for parking money, not growing it.
  answer: About ₹301
- id: p-m0-fd-break
  module: 0
  title: Breaking an FD early
  value: 2250
  unit: "₹"
  tolerance: 1
  question: Arjun put ₹1,00,000 in a 1-year FD at 7%. After 6 months he needs the money. The bank's rate for a 6-month FD is 5.5%, and it charges a 1% penalty for breaking early. Using simple interest, how much interest does he actually get?
  solution: |
    Banks usually pay the rate for the period the money actually stayed, minus a penalty.
    Rate applied = 5.5% − 1% = 4.5% p.a.
    Interest = 1,00,000 × 0.045 × 6/12 = **₹2,250**
    Had he waited 6 months more, he'd have got about ₹7,000. Lesson: put money you might need soon in a savings account or sweep-in FD, not a long FD.
  answer: ₹2,250
- id: p-m0-networth
  module: 0
  title: Arjun's net worth
  value: 148000
  unit: "₹"
  tolerance: 0
  abs_tolerance: 1
  question: "Arjun has ₹60,000 in savings, a ₹45,000 FD, ₹85,000 in EPF and a bike worth ₹90,000. He owes ₹1,20,000 on his bike loan and ₹12,000 on his credit card. What is his net worth?"
  solution: |
    Assets = 60,000 + 45,000 + 85,000 + 90,000 = ₹2,80,000
    Liabilities = 1,20,000 + 12,000 = ₹1,32,000
    Net worth = 2,80,000 − 1,32,000 = **₹1,48,000**
    Notice the bike: it's an asset that loses value every year, while the loan for it doesn't shrink as fast. Vehicles bought on loans often pull net worth down.
  answer: ₹1,48,000
- id: p-m0-card-minimum
  module: 0
  title: The cost of paying only the minimum
  value: 1177
  unit: "₹"
  tolerance: 3
  question: "Arjun's credit card bill is ₹30,000. He pays only the minimum due of ₹1,500. His card charges 3.5% a month on unpaid balances, and GST of 18% applies to interest. Roughly how much interest + GST will he pay for one month on the unpaid ₹28,500? (Simplified: ignore that interest actually starts from each purchase date, which makes it worse.)"
  solution: |
    Interest = 28,500 × 3.5% = ₹997.50
    GST on interest = 997.50 × 18% = ₹179.55
    Total ≈ **₹1,177 for one month**
    3.5% a month is about 51% a year once compounded. In real life it's higher still, because interest runs from each purchase date and new purchases lose the interest-free period.
  answer: About ₹1,177
- id: p-m0-monthly-rate
  module: 0
  title: "\"Only 2% a month\""
  value: 26.8
  unit: "%"
  tolerance: 0
  abs_tolerance: 0.5
  question: A lender says "only 2% per month, compounded monthly". What is the effective yearly rate?
  solution: |
    Effective yearly rate = (1 + monthly rate)^12 − 1
    = 1.02^12 − 1 ≈ 1.268 − 1 = **26.8% a year**
    Always convert monthly or weekly rates to yearly before comparing. 2% a month sounds tiny; 26.8% a year is more than most personal loans.
  answer: About 26.8% a year
- id: p-m0-fixed-share
  module: 0
  title: How much of the salary is already spoken for?
  value: 43.2
  unit: "%"
  tolerance: 0
  abs_tolerance: 0.3
  question: "From Arjun's July statement in the lesson: salary ₹65,000; rent ₹16,000, bike EMI ₹3,877, money home ₹8,000, streaming subscription ₹199. What percentage of his salary goes to these fixed commitments?"
  solution: |
    Fixed commitments = 16,000 + 3,877 + 8,000 + 199 = ₹28,076
    Share = 28,076 ÷ 65,000 = **43.2%**
    Almost half his pay is committed before he chooses anything. Any new EMI makes that worse, which is why lenders and planners look at this ratio.
  answer: About 43%

