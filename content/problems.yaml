  question: Arjun does 2 intraday round trips of ₹1 lakh each every trading day. All charges (brokerage, STT, exchange fees, stamp duty, GST) come to about ₹82 per round trip. What do charges cost him over 250 trading days?
  solution: |
    Per day = 2 × ₹82 = ₹164
    Per year = 164 × 250 = **₹41,000**
    That's the profit he needs just to break even, before tax. On ₹1 lakh of capital, a 41% hurdle.
