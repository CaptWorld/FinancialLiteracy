- id: p-m6-bond-price
  module: 6
  title: What happens to a bond when rates rise?
  value: 932.9
  unit: "₹"
  tolerance: 0.5
  question: A 10-year bond with face value ₹1,000 pays a 7% coupon (₹70 a year, paid yearly). Market rates for similar bonds rise to 8%. What is the bond's fair price now?
  solution: |
    Price = present value of coupons + present value of ₹1,000 at maturity, discounted at 8%.
    = 70 × [1 − 1.08⁻¹⁰] ÷ 0.08 + 1,000 ÷ 1.08¹⁰
    = 70 × 6.710 + 463.2 ≈ 469.7 + 463.2 = **₹932.9**
    A 1% rise in rates cut its price about 6.7%. Longer bonds fall even more.
  answer: About ₹933
