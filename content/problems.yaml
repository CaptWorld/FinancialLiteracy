  title: Leverage in a futures trade
  value: 15
  unit: "%"
  tolerance: 0
  abs_tolerance: 0.5
  question: A futures position has an exposure of ₹15 lakh and Arjun has put up ₹2 lakh of margin. The underlying index moves 2% against him. What percentage of his margin has he lost?
  solution: |
    Loss = 2% × ₹15,00,000 = ₹30,000
    As % of margin = 30,000 ÷ 2,00,000 = **15%**
    Leverage here is 7.5× (15 ÷ 2). A ~13% adverse move would wipe out the entire margin.
  answer: 15%
