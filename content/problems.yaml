- id: p-inflation-1
  module: 1
  title: What will ₹50,000/month cost in 15 years?
  value: 119800
  unit: "₹"
  tolerance: 2
  question: Your monthly expenses are ₹50,000. If inflation averages 6%, what will the same lifestyle cost per month in 15 years?
  solution: |
    Future cost = today × (1 + inflation)^years
    = 50,000 × 1.06^15
    1.06^15 ≈ 2.397
    = 50,000 × 2.397 ≈ **₹1,19,800 per month**
    Your lifestyle cost more than doubles. Rule of 72 check: 72 ÷ 6 = 12 years to double, so 15 years is a bit more than double. ✔
  answer: About ₹1.2 lakh per month
  tool: compound
- id: p-real-1
  module: 1
  title: Real return of an FD after tax
  value: -1.0
  unit: "%"
  tolerance: 0
  abs_tolerance: 0.3
  question: An FD pays 7%. You're in a 30% tax slab (ignore cess). Inflation is 6%. What is your approximate real, after-tax return?
  solution: |
    After-tax interest = 7% × (1 − 0.30) = 4.9%
    Real return ≈ (1.049 ÷ 1.06) − 1 ≈ **−1.0%**
    You lose about 1% of buying power a year. FDs are fine for safety and short-term needs, not for long-term growth.
  answer: About −1% a year
  tool: compound
- id: p-compound-1
  module: 1
  title: Simple vs compound over 20 years
  value: 932200
  unit: "₹"
  tolerance: 2
  question: ₹2 lakh at 8% a year for 20 years. How much with simple interest vs yearly compounding?
  solution: |
    Simple: 2,00,000 + 2,00,000 × 0.08 × 20 = 2,00,000 + 3,20,000 = **₹5,20,000**
    Compound: 2,00,000 × 1.08^20 ≈ 2,00,000 × 4.661 = **₹9,32,200**
    Compounding adds over ₹4 lakh extra, and most of it comes in the later years.
  answer: ₹5.2 lakh simple vs ₹9.3 lakh compound
  tool: compound
