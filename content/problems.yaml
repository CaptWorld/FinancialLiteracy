  question: Arjun's savings account pays 3% p.a., calculated on the daily balance. In a 92-day quarter he had ₹50,000 for the first 45 days and ₹30,000 for the remaining 47 days. Roughly how much interest does he get for the quarter?
  solution: |
    Day's interest = balance × rate ÷ 365
    First part: 50,000 × 0.03 × 45 ÷ 365 ≈ ₹184.9
    Second part: 30,000 × 0.03 × 47 ÷ 365 ≈ ₹115.9
    Total ≈ **₹301 for the quarter**, about ₹1,200 a year on ~₹40,000.
    That's why a savings account is for parking money, not growing it.
