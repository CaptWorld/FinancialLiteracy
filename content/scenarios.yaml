- id: s-loanapp
  module: 3
  title: The instant loan app
  situation: Your cousin needs ₹20,000 for a week. An app on Instagram offers instant approval, "only 3% per month", no documents, but asks for access to contacts and photos.
  options:
    - text: Take it, 3% sounds small.
      verdict: bad
      feedback: 3% a month is about 36% a year before fees, and these apps often deduct big "processing fees" upfront. Contact/photo access is used for harassment when repayment is late. Many such apps aren't regulated.
    - text: Check if the lender is an RBI-regulated bank/NBFC, read the key fact statement, and refuse contact/photo access.
      verdict: ok
      feedback: Better. Legitimate digital lenders must disclose the real yearly cost and can't demand broad phone access. Still expensive for a week's need.
    - text: Lend from your emergency fund or help them find a cheaper option, and skip the app.
      verdict: good
      feedback: For a short, small need, family help or a card's interest-free period (paid in full) is far cheaper and safer. Module 4 covers how to verify lenders.
- id: s-kyc-call
  module: 3
  title: The KYC call
  situation: A caller with your name and bank details says your account will be frozen in 2 hours unless you complete "video KYC" by installing an app and sharing the code you receive.
  options:
    - text: Install the app; they know your details so it must be real.
      verdict: bad
      feedback: Leaked data is common. The app is likely screen-sharing, and the code is an OTP. You'd be handing over your account.
    - text: Hang up and check the bank's official app or call the number on your card.
      verdict: good
      feedback: Right. Real KYC updates are done in the branch or official app. Urgency is the scammer's tool.
    - text: Ask them to call back tomorrow.
      verdict: ok
      feedback: Buys time, but they'll call back with more pressure. Just verify independently and block the number. Report it on Sanchar Saathi's Chakshu.
- id: s-offer
  module: 2
  title: Two job offers
  situation: "Offer A: ₹20 LPA with ₹4 L variable, ₹2 L joining bonus (clawback if you leave within a year). Offer B: ₹18 LPA with ₹1 L variable, no joining bonus."
  options:
    - text: Take A, bigger number.
      verdict: bad
      feedback: Fixed pay in A is ₹16 L minus whatever of the ₹2 L joining bonus is counted in CTC, and variable may not be paid in full. B's fixed is ₹17 L.
    - text: Compare fixed monthly gross, realistic variable payout, benefits, and clawback terms.
      verdict: good
      feedback: Yes. Ask HR for a monthly gross breakdown and the last 2 years' average variable payout. Then compare in-hand.
    - text: Take B, smaller variable is always better.
      verdict: ok
      feedback: Often true for guaranteed money, but compare benefits (insurance, PF on full basic, ESOPs) and growth too.
- id: s-bonus
  module: 1
  title: The ₹1.5 lakh bonus
  situation: You get a ₹1.5 lakh bonus. You have ₹35,000 on a credit card (paying minimum), ₹40,000 in savings, and no health insurance besides your employer's.
  options:
    - text: Start a ₹1.5 lakh lump sum in a small-cap fund.
      verdict: bad
      feedback: Your card debt costs far more than any expected return, and you have almost no safety net.
    - text: Clear the card, add to the emergency fund, and look into a personal health policy.
      verdict: good
      feedback: Guaranteed savings on card interest, more safety, and protection that stays when you change jobs. Then start investing from monthly cash flow.
    - text: Clear the card, invest the rest.
      verdict: ok
      feedback: Clearing the card is right. But with ₹40k saved, building your emergency fund first is the safer next step.
- id: s-fd-agent
  module: 1
  title: The relationship manager's "FD alternative"
  situation: Your bank's relationship manager suggests moving your FD to a "guaranteed return plan" with life cover, 5 years premium, 10 years lock-in, "tax-free returns".
  options:
    - text: Sign up; it's from my bank so it's safe.
      verdict: bad
      feedback: This is likely a traditional insurance-savings product. They usually pay high commissions and low returns, with heavy penalties for early exit. Banks earn commission on these.
    - text: Ask for the benefit illustration and compute the actual return (IRR) yourself before deciding.
      verdict: good
      feedback: Yes. Such plans often work out to low single-digit returns. Compare with a term plan plus your own investing (Module 5).
    - text: Ask what commission they earn.
      verdict: ok
      feedback: A fair question, and their reaction is informative. Still compute the return yourself.

# ---- Module 0 ----
- id: s-m0-old-salary-account
  module: 0
  title: The forgotten salary account
  situation: Arjun changed jobs 18 months ago. His old salary account still has ₹4,200 in it. He hasn't logged in since. His new salary goes to a different bank.
  options:
    - text: Leave it. It's zero-balance, so it costs nothing.
      verdict: bad
      feedback: Zero-balance usually ends when salary stops. It has likely been converted to a regular savings account, quietly charging minimum-balance fees, SMS fees and a debit card fee, and it's one more account a fraudster could target.
    - text: Log in, download the last 12 months' statements, check for charges and linked auto-debits, then move the money and close it (or keep it deliberately with the minimum balance).
      verdict: good
      feedback: Right. Check first so no EMI or SIP mandate bounces, then close it or keep it on purpose. Fewer accounts = fewer statements to check and less fraud surface.
    - text: Withdraw the cash at an ATM and forget the account.
      verdict: ok
      feedback: The money is safe, but the account stays open and can keep charging fees, possibly pushing the balance negative or being reported. Close it formally.
- id: s-m0-card-call
  module: 0
  title: The "lifetime free" credit card call
  situation: A caller from Arjun's bank offers a "lifetime free, pre-approved" credit card with a ₹2 lakh limit. Arjun has never had a credit card and sometimes runs short before payday.
  options:
    - text: Take it. Free money for the last week of the month.
      verdict: bad
      feedback: It's a loan, not free money. Running short before payday is exactly when people start paying only the minimum, at 40%+ a year. Fix the budget first.
    - text: Decline for now; build a one-month buffer and track spending. Consider a low-limit card later, with auto-pay set to the full amount.
      verdict: good
      feedback: A card is useful once you reliably pay in full. A small limit and full auto-pay make that the default. Check "lifetime free" conditions in the MITC document.
    - text: Take it but never use it.
      verdict: ok
      feedback: An unused card is mostly harmless and the credit line can slightly help your score, but check it really has no annual fee and keep it locked against fraud.
- id: s-m0-emergency-place
  module: 0
  title: Where should the emergency money live?
  situation: Arjun has saved ₹1.5 lakh for emergencies (job loss, a medical bill). It's all in his savings account earning about 3%. A friend says "That's a waste, put it in stocks".
  options:
    - text: Move it all into stocks for higher returns.
      verdict: bad
      feedback: Emergencies and market crashes often arrive together (2020 is the example). Stocks can be down 30% exactly when he needs the money.
    - text: Keep part in savings for instant use and the rest in a sweep-in FD or a short FD at the same bank.
      verdict: good
      feedback: Emergency money must be safe and quick to reach. Sweep-in FDs earn more while staying reachable. A small real loss to inflation is the price of safety, and it's worth paying.
    - text: Keep it all in savings as it is.
      verdict: ok
      feedback: Safe and instant, so not wrong. A sweep-in or short FD for part of it would earn a bit more without real risk.

# ---- Module 4 ----
- id: s-m4-wedding
  module: 4
  title: Paying for a sister's wedding
  situation: Arjun's family expects him to contribute ₹4 lakh to his sister's wedding in 8 months. He has ₹1.2 lakh saved (his emergency fund) and saves about ₹17,000 a month. A bank app offers a ₹4 lakh pre-approved personal loan "in 2 minutes".
  options:
    - text: Take the full ₹4 lakh loan now and keep his savings untouched.
      verdict: bad
      feedback: He'd pay personal-loan interest for months before the money is even needed, and lock in a big EMI for years. Pre-approved doesn't mean cheap. Check the KFS and APR.
    - text: Save ₹17,000 a month for 8 months (~₹1.36 lakh), talk honestly with family about a smaller contribution, and borrow only the gap, close to the date, after comparing KFSs.
      verdict: good
      feedback: Borrowing less, later and for a shorter time is the cheapest loan. Keeping his emergency fund intact means one surprise won't push him into card debt.
    - text: Use the whole ₹1.2 lakh emergency fund and borrow the rest.
      verdict: ok
      feedback: It cuts the loan, but leaves him with no buffer while carrying an EMI. Using part of it and rebuilding quickly is a middle path.
- id: s-m4-reset-letter
  module: 4
  title: The reset letter nobody reads
  situation: Arjun's bank emails that his floating home-loan rate rose from 8.5% to 9.25% "with no change in EMI". The remaining tenure line now says 248 months instead of 216.
  options:
    - text: Ignore it; the EMI didn't change.
      verdict: bad
      feedback: "32 extra months of EMIs is the real cost, about ₹11 lakh more. Silence is how tenure creep happens."
    - text: Ask the bank for his options (higher EMI, part-prepayment, a mix) and choose a higher EMI he can afford, plus ask whether they'll lower his spread.
      verdict: good
      feedback: RBI's rules require lenders to explain your options at a reset. A modest EMI rise keeps the original end date. A spread cut request costs nothing to ask.
    - text: Switch to another bank immediately.
      verdict: ok
      feedback: A balance transfer can help, but fees, legal and valuation charges and paperwork add up. Ask your own bank first and compare.
- id: s-m4-guarantor
  module: 4
  title: "\"Just sign as guarantor, it's a formality\""
  situation: A close friend asks Arjun to be guarantor for a ₹6 lakh business loan from an NBFC. "It's just a formality, I'll never miss an EMI."
  options:
    - text: Sign. Friends help each other.
      verdict: bad
      feedback: A guarantor is legally liable for the whole amount. If the friend defaults, recovery and the credit-score damage come to Arjun.
    - text: Read the KFS and agreement, ask himself if he could repay ₹6 lakh himself, and decline politely if not (offering other help).
      verdict: good
      feedback: Guarantee only what you could afford to pay. Saying no protects both the friendship and your credit for future loans like a home loan.
    - text: Sign, but ask the friend for a written promise.
      verdict: ok
      feedback: A private promise doesn't change Arjun's legal liability to the lender. Better than nothing, but not real protection.

# ---- Module 5 ----
- id: s-m5-bank-rm
  module: 5
  title: The relationship manager's "special plan"
  situation: Arjun visits his bank to update his address. The relationship manager suggests a "guaranteed savings plan, better than FD, tax-free, only ₹50,000 a year for 7 years". Arjun has no term cover and no personal health policy.
  options:
    - text: Sign up. The bank wouldn't sell something bad.
      verdict: bad
      feedback: It's an insurance policy with a long lock-in and likely ~4–6% IRR. The RM earns commission. Arjun's real gaps, term and health cover, stay unfilled.
    - text: Ask for the benefit illustration and policy wording, calculate the IRR at home, and first buy term and health cover with that money.
      verdict: good
      feedback: Protection first, investment separately. If the IRR is low, and it usually is, he walks away with nothing lost.
    - text: Take it, and cancel in the free-look period if he changes his mind.
      verdict: ok
      feedback: The 30-day free-look is real protection, but signing under pressure and hoping to remember to cancel is risky. Better not to sign in the branch.
- id: s-m5-employer-only
  module: 5
  title: "\"My company covers me\""
  situation: Arjun has ₹5 lakh employer health cover with a 1% room-rent limit. He's healthy, 27, and thinks a personal policy is a waste until he's 35.
  options:
    - text: Wait till 35; he's healthy now.
      verdict: bad
      feedback: Any illness that appears in the meantime becomes a pre-existing condition with up to 3 years' wait. Premiums are also higher later. A job loss would leave him uncovered.
    - text: Buy a personal base policy (no room-rent limit) now plus a super top-up, and keep the employer cover as an extra layer.
      verdict: good
      feedback: Waiting periods finish while he's healthy, cover stays across jobs, and the super top-up makes total cover large at low cost.
    - text: Buy only a super top-up over the employer cover.
      verdict: ok
      feedback: Cheap and boosts cover, but if he leaves the job, the top-up's deductible has nothing underneath it. A small personal base policy fixes that.

# ---- Module 6 ----
- id: s-m6-rate-cut-fd
  module: 6
  title: "\"RBI will cut rates next month\""
  situation: Arjun has ₹2 lakh in savings meant for a goal 3 years away. News says RBI may cut the repo rate soon. A colleague says FD rates will fall after that.
  options:
    - text: Do nothing; FD rates don't depend on RBI.
      verdict: bad
      feedback: Bank deposit rates do follow RBI's policy over time. Ignoring that isn't a strategy, though nobody knows the timing for sure.
    - text: Book a 3-year FD matching his goal now, at today's rate, and stop worrying about the exact timing.
      verdict: good
      feedback: The FD's rate is locked for its term and the term matches his goal. If rates fall, he's protected; if they rise, he's still on track. Matching money to the goal beats predicting RBI.
    - text: Move it to a long-term bond fund to profit from the rate cut.
      verdict: ok
      feedback: Long bond funds can gain if rates fall, but can also lose if they don't, and the holding period may not match a 3-year goal. That's a bet, not a plan.
- id: s-m6-recession-sip
  module: 6
  title: Recession headlines and a SIP
  situation: Every channel is predicting a recession. Arjun's ₹5,000 monthly equity index SIP for a 25-year goal is down 12% from its peak. His company has frozen hiring.
  options:
    - text: Stop the SIP and redeem everything before it falls further.
      verdict: bad
      feedback: That locks in the fall and requires guessing when to get back in. Over 25 years, recessions are bumps; selling during them is how long-term investors lose.
    - text: Continue the SIP, and top up his emergency fund in case of job loss.
      verdict: good
      feedback: The real recession risk to Arjun is his income, not his long-term SIP. A bigger emergency fund protects him from being forced to sell at the bottom.
    - text: Pause the SIP for a few months to build cash, then restart.
      verdict: ok
      feedback: Reasonable if his emergency fund is thin. The key is restarting on a fixed date, not waiting until things "look better".

# ---- Module 7 ----
- id: s-m7-nfo
  module: 7
  title: The ₹10 NFO
  situation: Arjun's banking app shows a new "Manufacturing Opportunities Fund" NFO at ₹10 per unit, "lower NAV, more units, get in at the ground floor". Manufacturing stocks are up 50% this year.
  options:
    - text: Invest ₹50,000 now; ₹10 units are cheap.
      verdict: bad
      feedback: NAV is just the unit price; it isn't "cheap". This is a concentrated thematic bet launched after a big run-up, often the worst timing.
    - text: Skip it. Keep the plan, a broad index fund SIP, which already holds manufacturing companies in proportion.
      verdict: good
      feedback: A diversified index fund already owns the sector without the concentration, the NFO hype or the higher costs.
    - text: Put a small amount in "to try it".
      verdict: ok
      feedback: A small amount won't hurt much, but there's no reason in the plan for it. Small bets add clutter and costs over time.
- id: s-m7-five-funds
  module: 7
  title: Five funds, one portfolio
  situation: Arjun's friend has SIPs in five large-cap and flexi-cap funds (regular plans) from his bank's RM, and feels well diversified.
  options:
    - text: Add a sixth fund for even more diversification.
      verdict: bad
      feedback: Their top holdings probably overlap heavily. More funds add costs and paperwork, not diversification.
    - text: Check the top-10 holdings for overlap, then consolidate into one or two direct-plan funds (e.g. a broad index fund) for new SIPs, considering exit loads and tax before moving old money.
      verdict: good
      feedback: Fewer, cheaper, broader funds are simpler and usually better. Switching existing units can trigger exit load and capital gains tax, so it's often done gradually.
    - text: Keep everything as is; it's working.
      verdict: ok
      feedback: Not disastrous, but he pays commissions every year on five overlapping funds. Switching at least new SIPs to direct plans is an easy win.
